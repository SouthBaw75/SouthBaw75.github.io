  getMenuHitboxes(){
    const {items}=this.getActiveMenuContext();
    const {startY,gap}=this.getMenuLayout();
    return items.map((item,i)=>({item,index:i,rect:{x:W/2-170,y:startY+i*gap-22,w:340,h:44}}));
  }

  handleMenuTap(pt){
    if(this.menuMode==='powerups'){
      this.menuMode='main';this.audio.menuMove();return true;
    }
    const {selectedKey}=this.getActiveMenuContext();
    for(const hit of this.getMenuHitboxes()){
      if(this.pointInRect(pt,hit.rect)&&!hit.item.dim){
        this[selectedKey]=hit.index;
        this.audio.menuSelect();
        hit.item.fn();
        return true;
      }
    }
    return false;
  }
  getLobbyCodeRect(){
    return{x:110,y:238,w:380,h:84};
  }
  getLobbyCancelRect(){
    return{x:190,y:456,w:220,h:42};
  }
  handleLobbyTap(pt){
    if(this.pointInRect(pt,this.getLobbyCodeRect())){
      this.copyRoomCode();
      this.audio.menuSelect();
      return true;
    }
    if(this.pointInRect(pt,this.getLobbyCancelRect())){
      this.audio.menuMove();
      this.goMenu('Room closed.');
      return true;
    }
    return false;
  }

  getSelectBackRect(){
    return{x:20,y:16,w:84,h:24};
  }

  getSelectCardRects(){
    const tankW=250,tankH=240,gapX=18,gapY=18;
    const startX=(W-(tankW*2+gapX))/2;
    const startY=86;
    return TANK_ORDER.map((type,i)=>({
      index:i,
      rect:{
        x:startX+(i%2)*(tankW+gapX),
        y:startY+Math.floor(i/2)*(tankH+gapY),
        w:tankW,
        h:tankH,
      },
    }));
  }

  handleSelectTap(pt){
    if(this.input.shouldShowTouchControls()&&this.pointInRect(pt,this.getSelectBackRect())){
      this.audio.menuMove();
      this.goMenu();
      return true;
    }
    const activePlayer=this.getSelectActivePlayer();
    if(!activePlayer)return false;
    for(const hit of this.getSelectCardRects()){
      if(!this.pointInRect(pt,hit.rect))continue;
      if(this.isOnlineMode()){
        const currentSel=activePlayer===1?this.p1Sel:this.p2Sel;
        const ready=currentSel===hit.index;
        this.updateOnlineSelection(hit.index,ready);
        this.audio[ready?'menuSelect':'menuMove']();
      }else if(activePlayer===1){
        if(this.p1Sel===hit.index){
          this.p1Ready=true;
          this.audio.menuSelect();
        }else{
          this.p1Sel=hit.index;
          if(this.singlePlayer)this.p2Sel=(this.p1Sel+1)%TANK_ORDER.length;
          this.audio.menuMove();
        }
      }else{
        if(this.p2Sel===hit.index){
          this.p2Ready=true;
          this.audio.menuSelect();
        }else{
          this.p2Sel=hit.index;
          this.audio.menuMove();
        }
      }
      return true;
    }
    return false;
  }

  getEndHitboxes(opts){
    const startY=H/2+85;
    return opts.map((opt,i)=>({index:i,rect:{x:W/2-130,y:startY+i*40-15,w:260,h:30}}));
  }

  getPauseButtonRect(){
    return{x:W/2-36,y:46,w:72,h:12};
  }

  handlePauseButtonTap(pt){
    return this.pointInRect(pt,this.getPauseButtonRect());
  }

  getPauseHitboxes(opts){
    const startY=H/2-26;
    return opts.map((opt,i)=>({index:i,rect:{x:W/2-120,y:startY+i*48,w:240,h:34}}));
  }

  handlePauseTap(pt,opts){
    for(const hit of this.getPauseHitboxes(opts)){
      if(!this.pointInRect(pt,hit.rect))continue;
      this.pauseSel=hit.index;
      this.commitPauseAction(opts[this.pauseSel]);
      return true;
    }
    return false;
  }

  handleEndTap(pt,opts){
    for(const hit of this.getEndHitboxes(opts)){
      if(!this.pointInRect(pt,hit.rect))continue;
      this.endSel=hit.index;
      this.audio.menuSelect();
      this.commitEndAction(opts[this.endSel]);
      return true;
    }
    return false;
  }

  drawControlDock(ctx){
    const dockY=ARENA_BOTTOM;
    const dockH=H-ARENA_BOTTOM;
    const g=ctx.createLinearGradient(0,dockY,0,H);
    g.addColorStop(0,'rgba(5,8,20,.96)');
    g.addColorStop(.55,'rgba(6,10,18,.98)');
    g.addColorStop(1,'rgba(3,4,10,1)');
    ctx.fillStyle=g;
    ctx.fillRect(0,dockY,W,dockH);
    ctx.strokeStyle='rgba(0,255,136,.16)';
    ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,dockY+.5);ctx.lineTo(W,dockY+.5);ctx.stroke();
    ctx.strokeStyle='rgba(58,58,98,.34)';
    ctx.beginPath();ctx.moveTo(W/2,dockY+22);ctx.lineTo(W/2,H-20);ctx.stroke();
    ctx.fillStyle='rgba(0,255,136,.045)';
    ctx.fillRect(20,dockY+18,236,dockH-34);
    ctx.fillStyle='rgba(255,64,64,.05)';
    ctx.fillRect(W-256,dockY+18,236,dockH-34);
  }

  drawTouchControls(ctx){
    const layout=this.getTouchLayout();
    if(!layout)return;
    const joy=this.input.joystick;
    const knobX=layout.joystick.x+joy.x*34;
    const knobY=layout.joystick.y+joy.y*34;

    ctx.save();
    ctx.globalAlpha=.96;

    ctx.fillStyle='rgba(4,8,18,.82)';
    ctx.beginPath();ctx.arc(layout.joystick.x,layout.joystick.y,layout.joystick.r+16,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(0,255,136,.22)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(layout.joystick.x,layout.joystick.y,layout.joystick.r+10,0,Math.PI*2);ctx.stroke();
    ctx.strokeStyle='rgba(0,255,136,.18)';
    ctx.beginPath();ctx.arc(layout.joystick.x,layout.joystick.y,layout.joystick.r-8,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(layout.joystick.x-layout.joystick.r+10,layout.joystick.y);ctx.lineTo(layout.joystick.x+layout.joystick.r-10,layout.joystick.y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(layout.joystick.x,layout.joystick.y-layout.joystick.r+10);ctx.lineTo(layout.joystick.x,layout.joystick.y+layout.joystick.r-10);ctx.stroke();
    ctx.fillStyle='rgba(0,255,136,.12)';
    ctx.beginPath();ctx.arc(layout.joystick.x,layout.joystick.y,layout.joystick.r-16,0,Math.PI*2);ctx.fill();
    ctx.shadowColor=PAL.green;ctx.shadowBlur=16;
    ctx.fillStyle=joy.active?PAL.green:'#00aa66';
    ctx.beginPath();ctx.arc(knobX,knobY,26,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#04110c';
    ctx.beginPath();ctx.arc(knobX,knobY,12,0,Math.PI*2);ctx.fill();

    ctx.fillStyle='rgba(18,0,0,.84)';
    ctx.beginPath();ctx.arc(layout.fire.x,layout.fire.y,layout.fire.r+18,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,96,96,.28)';
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(layout.fire.x,layout.fire.y,layout.fire.r+10,0,Math.PI*2);ctx.stroke();
    ctx.shadowColor=PAL.red;ctx.shadowBlur=18;
    ctx.fillStyle=this.input.fire.active?PAL.red:'#bb2020';
    ctx.beginPath();ctx.arc(layout.fire.x,layout.fire.y,layout.fire.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.12)';
    ctx.beginPath();ctx.arc(layout.fire.x-10,layout.fire.y-12,layout.fire.r*.55,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff4ee';
    ctx.font='13px "Press Start 2P"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('FIRE',layout.fire.x,layout.fire.y+2);

    ctx.font='8px "Press Start 2P"';
    ctx.fillStyle=PAL.dim;
    ctx.fillText('MOVE',layout.joystick.x,layout.joystick.y+layout.joystick.r+26);
    ctx.fillText('FIRE',layout.fire.x,layout.fire.y+layout.fire.r+24);
    ctx.restore();
  }

  renderGameToText(){
    const states=['BOOT','SPLASH','MENU','SELECT','PLAYING','END','LOBBY','PAUSE'];
    const payload={
      mode:states[this.state],
      menuMode:this.menuMode,
      coordSystem:'origin top-left; x increases right; y increases down; arena begins below HUD at y=60',
      singlePlayer:this.singlePlayer,
      gameMode:this.gameMode,
      online:this.isOnlineMode()?{playerNum:this.online.playerNum,roomCode:this.online.roomCode,status:this.online.status}:null,
      share:this.menuMode==='share'?{url:this.getShareUrl(),status:this.shareQrStatus,notice:this.shareNotice}:null,
      round:this.roundNum+1,
      roundTarget:ROUND_KILLS_TO_WIN,
      matchTarget:KILLS_WIN,
      countdown:this.gameReady?null:this.countdownVal,
      players:this.tanks.map(t=>({
        player:t.playerNum,type:t.type,alive:t.alive,
        x:Math.round(t.x),y:Math.round(t.y),angle:Number(t.angle.toFixed(2)),
        roundKills:t.roundKills,matchWins:t.kills,
        isCPU:t.isCPU,
        shield:t.shield,ghost:t.ghost,rapid:t.rapid,triple:t.triple,bounce:t.bounceBonus,breach:t.wallBreak,
      })),
      touchControls:this.getTouchLayout(),
      bullets:this.bullets.filter(b=>b.active).map(b=>({x:Math.round(b.x),y:Math.round(b.y),owner:b.owner.playerNum,bounces:b.bounces,wallBreak:b.wallBreak})),
      powerups:this.powerups.filter(p=>p.active).map(p=>({type:p.type,x:Math.round(p.x),y:Math.round(p.y)})),
      winner:this.winner?this.winner.playerNum:null,
      pauseOptions:this.state===STATE.PAUSE?this.getPauseOptions():null,
    };
    return JSON.stringify(payload);
  }

  normalizeAngle(a){
    return ((a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
  }

  hasLineOfSight(ax,ay,bx,by){
    const dx=bx-ax,dy=by-ay;
    const dist=Math.hypot(dx,dy);
    const steps=Math.max(2,Math.ceil(dist/18));
    for(let i=1;i<steps;i++){
      const t=i/steps;
      if(this.arena.solid(ax+dx*t,ay+dy*t))return false;
    }
    return true;
  }

  cellKey(col,row){
    return `${col},${row}`;
  }

  isBotNavCellOpen(col,row){
    if(!this.arena.inBounds(col,row)||this.arena.isWall(col,row))return false;
    const center=this.arena.cellCenter(col,row);
    return this.arena.canTankOccupy(center.x,center.y,14);
  }

  findBotPath(startCell,goalCell){
    const startKey=this.cellKey(startCell.col,startCell.row);
    const goalKey=this.cellKey(goalCell.col,goalCell.row);
    if(startKey===goalKey)return[startCell];
    const queue=[startCell];
    const visited=new Set([startKey]);
    const prev=new Map();
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];

    while(queue.length){
      const cur=queue.shift();
      for(const[dc,dr]of dirs){
        const next={col:cur.col+dc,row:cur.row+dr};
        const key=this.cellKey(next.col,next.row);
        if(visited.has(key)||!this.isBotNavCellOpen(next.col,next.row))continue;
        visited.add(key);
        prev.set(key,cur);
        if(key===goalKey){
          const path=[next];
          let back=cur;
          while(back){
            path.push(back);
            const backKey=this.cellKey(back.col,back.row);
            back=prev.get(backKey)||null;
          }
          return path.reverse();
        }
        queue.push(next);
      }
    }
    return[startCell];
  }

  getBotPathPlan(bot,target){
    const nav=bot.botNav;
    const startCell=this.arena.worldToCell(bot.x,bot.y);
    const goalCell=this.arena.worldToCell(target.x,target.y);
    const startKey=this.cellKey(startCell.col,startCell.row);
    const goalKey=this.cellKey(goalCell.col,goalCell.row);
    const planExpired=nav.lastPlanTime<0||(this.now-nav.lastPlanTime)>650;
    const goalMoved=goalKey!==nav.goalKey;
    const startMoved=startKey!==nav.startKey;
    if(planExpired||goalMoved||startMoved||nav.forceRepath||!nav.path.length){
      nav.path=this.findBotPath(startCell,goalCell);
      nav.lastPlanTime=this.now;
      nav.startKey=startKey;
      nav.goalKey=goalKey;
      nav.forceRepath=false;
    }
    let nextCell=null;
    if(nav.path.length>1){
      const currentIdx=nav.path.findIndex(cell=>cell.col===startCell.col&&cell.row===startCell.row);
      nextCell=nav.path[currentIdx>=0?Math.min(currentIdx+1,nav.path.length-1):1];
    }else{
      nextCell=goalCell;
    }
    const waypoint=this.arena.cellCenter(nextCell.col,nextCell.row);
    nav.waypoint=waypoint;
    return{
      path:nav.path,
      waypoint,
      needsPath:nav.path.length>1,
      startCell,
      goalCell,
    };
  }

  genTunnels(){
    const palettes=['#4499ff','#ff8833','#33ff99','#cc44ff'];
    const col=palettes[Math.floor(Math.random()*palettes.length)];
    const findFloor=(rowMin,rowMax)=>{
      for(let i=0;i<100;i++){
        const c=1+Math.floor(Math.random()*(COLS-2));
        const r=rowMin+Math.floor(Math.random()*(rowMax-rowMin));
        if(!this.arena.isWall(c,r))return{col:c,row:r};
      }
      return{col:2,row:rowMin+1};
    };
    return[{a:findFloor(1,ROWS/2-2),b:findFloor(ROWS/2+2,ROWS-1),col}];
  }

  getBotInput(bot,enemy){
    const cmd={left:false,right:false,up:false,down:false,fire:false};
    if(!bot.alive||!enemy)return cmd;
    const target=enemy.alive?enemy:{x:W/2,y:H/2};

    // ── BULLET DODGE (highest priority) ──────────────────────────────
    let dodgeAngle=null;
    for(const b of this.bullets){
      if(!b.active||b.owner===bot)continue;
      const bx=bot.x-b.x, by=bot.y-b.y;
      const d=Math.hypot(bx,by);
      if(d>150)continue;
      const spd=Math.hypot(b.vx,b.vy);
      if(spd<0.1)continue;
      // Only dodge if bullet is heading toward us (dot > 0.65)
      const dot=(bx*b.vx+by*b.vy)/(d*spd);
      if(dot<0.65)continue;
      // Strafe perpendicular: choose side away from bullet's lateral axis
      const cross=bx*b.vy-by*b.vx;
      dodgeAngle=Math.atan2(b.vx,-b.vy)+(cross>=0?Math.PI/2:-Math.PI/2);
      break;
    }
    if(dodgeAngle!==null){
      const dd=this.normalizeAngle(dodgeAngle-bot.angle);
      if(dd>0.15)cmd.right=true;
      if(dd<-0.15)cmd.left=true;
      cmd.up=Math.abs(dd)<1.2;
      cmd.down=!cmd.up;
      // Opportunistic fire while dodging
      const ed=this.normalizeAngle(Math.atan2(target.x-bot.x,-(target.y-bot.y))-bot.angle);
      if(this.hasLineOfSight(bot.x,bot.y,target.x,target.y)&&Math.abs(ed)<0.18)cmd.fire=true;
      return cmd;
    }

    // ── POWER-UP GOAL ─────────────────────────────────────────────────
    let navGoal=target, isPUGoal=false, bestPUDist=Infinity;
    for(const pu of this.powerups){
      if(!pu.active)continue;
      const bd=Math.hypot(pu.x-bot.x,pu.y-bot.y);
      const ed=Math.hypot(pu.x-target.x,pu.y-target.y);
      if(bd<ed&&bd<bestPUDist){bestPUDist=bd;navGoal=pu;isPUGoal=true;}
    }

    // ── TUNNEL SHORTCUT ───────────────────────────────────────────────
    if(bot.tunnelCooldown<=0&&this.arena.tunnels.length>0){
      const dd=Math.hypot(navGoal.x-bot.x,navGoal.y-bot.y);
      for(const t of this.arena.tunnels){
        for(const [en,ex] of [[t.a,t.b],[t.b,t.a]]){
          const ec=this.arena.cellCenter(en.col,en.row);
          const xc=this.arena.cellCenter(ex.col,ex.row);
          if(Math.hypot(ec.x-bot.x,ec.y-bot.y)+Math.hypot(navGoal.x-xc.x,navGoal.y-xc.y)<dd*0.8){navGoal=ec;break;}
        }
      }
    }

    // ── PATHFINDING ───────────────────────────────────────────────────
    const plan=this.getBotPathPlan(bot,navGoal);
    const los=this.hasLineOfSight(bot.x,bot.y,target.x,target.y);
    const frontX=bot.x+Math.sin(bot.angle)*26;
    const frontY=bot.y-Math.cos(bot.angle)*26;
    const frontBlocked=this.arena.solid(frontX,frontY);
    // When ghost is active, tank can drive through walls — skip path planning
    const shouldPath=!bot.ghost&&plan.needsPath&&(!los||frontBlocked);
    const navTarget=shouldPath?plan.waypoint:navGoal;
    const dx=navTarget.x-bot.x, dy=navTarget.y-bot.y;
    const dist=Math.hypot(dx,dy);
    const targetAngle=Math.atan2(dx,-dy);
    const delta=this.normalizeAngle(targetAngle-bot.angle);
    const enemyAngle=Math.atan2(target.x-bot.x,-(target.y-bot.y));
    const enemyDelta=this.normalizeAngle(enemyAngle-bot.angle);
    // Use different phase offsets per player to desync combat oscillation
    const phase=Math.sin((this.now+bot.playerNum*1300)/750);

    // ── STUCK DETECTION ───────────────────────────────────────────────
    const movement=Math.hypot(bot.x-bot.botNav.lastX,bot.y-bot.botNav.lastY);
    if(shouldPath&&dist>18&&movement<0.45)bot.botNav.stuckMs+=this.dt;
    else bot.botNav.stuckMs=0;
    if(bot.botNav.stuckMs>420)bot.botNav.forceRepath=true;
    if(bot.botNav.stuckMs>1500){
      // Hard escape: back up and sidestep to break deadlock
      cmd.down=true;
      cmd.left=(bot.playerNum+Math.floor(this.now/900))%2===0;
      cmd.right=!cmd.left;
      bot.botNav.stuckMs=200;
      return cmd;
    }
    bot.botNav.lastX=bot.x; bot.botNav.lastY=bot.y;

    // Steer toward nav target
    if(delta>0.12)cmd.right=true;
    if(delta<-0.12)cmd.left=true;

    // ── MOVEMENT BEHAVIOR ─────────────────────────────────────────────
    if(frontBlocked&&Math.abs(delta)<0.55){
      cmd.left=delta<=0; cmd.right=delta>0; cmd.down=true;
    }else if(shouldPath){
      cmd.up=Math.abs(delta)<1.05;
      if(dist<14)bot.botNav.forceRepath=true;
    }else if(isPUGoal){
      cmd.up=Math.abs(delta)<1.0;
    }else if(dist>210){
      cmd.up=Math.abs(delta)<1.0;
    }else if(dist<160){
      // Combat range: circle-strafe around the enemy
      // Re-steer to face enemy
      if(enemyDelta>0.12)cmd.right=true;
      if(enemyDelta<-0.12)cmd.left=true;
      // Advance/retreat based on distance
      cmd.up=dist>100;
      cmd.down=dist<75;
      // Add lateral drift: when well-aimed, orbit sideways
      if(Math.abs(enemyDelta)<0.35){
        if(phase>=0){cmd.right=true;cmd.up=true;}
        else{cmd.left=true;cmd.up=true;}
      }
    }else if(!los){
      cmd.up=Math.abs(delta)<0.9;
    }else if(phase>0.7){
      cmd.up=true;
    }

    // ── SHOOTING ──────────────────────────────────────────────────────
    if(los&&Math.abs(enemyDelta)<0.18){
      cmd.fire=true;
    }else if(bot.bounceBonus&&!los){
      // Ricochet: simulate bounce trajectories and aim at one that reaches the enemy
      const bounceAngle=this.findBotRicochetAngle(bot,target);
      if(bounceAngle!==null){
        const bd=this.normalizeAngle(bounceAngle-bot.angle);
        if(Math.abs(bd)<0.15)cmd.fire=true;
        else{if(bd>0)cmd.right=true;else cmd.left=true;}
      }
    }

    return cmd;
  }

  // Simulate 24 bullet angles with one wall bounce; return angle whose path comes closest to target
  findBotRicochetAngle(bot,target){
    let bestAngle=null, bestDist=60;
    for(let ai=0;ai<24;ai++){
      const angle=(ai/24)*Math.PI*2;
      let x=bot.x, y=bot.y;
      let vx=Math.sin(angle)*BULLET_SPD;
      let vy=-Math.cos(angle)*BULLET_SPD;
      let bounced=false;
      for(let s=0;s<40;s++){
        x+=vx; y+=vy;
        if(x<0||x>W||y<HUD||y>ARENA_BOTTOM)break;
        if(this.arena.solid(x,y)){
          if(bounced)break;
          const hb=this.arena.solid(x-vx,y);
          const vb=this.arena.solid(x,y-vy);
          if(vb&&!hb)vy=-vy;
          else if(hb&&!vb)vx=-vx;
          else{vx=-vx;vy=-vy;}
          bounced=true;
          x+=vx; y+=vy;
        }
        if(bounced){
          const d=Math.hypot(x-target.x,y-target.y);
          if(d<bestDist){bestDist=d;bestAngle=angle;}
        }
      }
    }
    return bestAngle;
  }
}
