          const a=Math.random()*W,b=HUD+Math.random()*AH;
          this.ps.emit(a,b,winner.col,20,8,5,50);
          this.ps.emit(a,b,'#ffdd00',10,10,3,40);
        },i*200);
      }
      this.onlineEvents.push({type:'roundWin',col:winner.col});
    }
    if(this.isOnlineHost())this.broadcastOnlineSnapshot();
  }

  updatePause(){
    const opts=this.getPauseOptions();
    const tap=this.input.consumeTap();
    if(tap&&this.handlePauseTap(tap,opts))return;
    if(this.input.wasPressed('ArrowDown')||this.input.wasPressed('KeyS')){
      this.pauseSel=(this.pauseSel+1)%opts.length;
      this.audio.menuMove();
    }
    if(this.input.wasPressed('ArrowUp')||this.input.wasPressed('KeyW')){
      this.pauseSel=(this.pauseSel-1+opts.length)%opts.length;
      this.audio.menuMove();
    }
    if(this.input.wasPressed('Escape')){
      this.audio.menuMove();
      this.closePauseMenu();
      return;
    }
    if(this.input.wasPressed('Enter')||this.input.wasPressed('Space')||this.input.wasPressed('NumpadEnter')){
      this.commitPauseAction(opts[this.pauseSel]);
    }
  }

  spawnPU(){
    if(this.powerups.filter(p=>p.active).length>=MAX_ACTIVE_POWERUPS)return;
    const pos=this.arena.randomFloor();
    const night=this.roundNum%NIGHT_ROUND_MOD===NIGHT_ROUND_MOD-1;
    const pool=night?PU_KEYS:PU_KEYS.filter(k=>k!=='RADAR');
    const type=pool[Math.floor(Math.random()*pool.length)];
    this.powerups.push(new PowerUp(pos.x,pos.y,type));
  }

  /* ══════════════════════════════════════════════
     END SCREEN UPDATE
  ══════════════════════════════════════════════ */
  updateEnd(){
    if(this.isOnlineGuest()){
      const opts=this.getEndOptions();
      const tap=this.input.consumeTap();
      if(tap&&this.handleEndTap(tap,opts))return;
      if(this.input.wasPressed('Escape')){
        this.goMenu('Left online room.');
        return;
      }
      if(this.input.wasPressed('Enter')||this.input.wasPressed('Space')||this.input.wasPressed('NumpadEnter')){
        this.commitEndAction(opts[0]);
      }
      return;
    }
    this.endTimer+=this.dt;
    this.ps.update();
    const opts=this.getEndOptions();
    const tap=this.input.consumeTap();
    if(tap&&this.handleEndTap(tap,opts))return;
    if(this.input.wasPressed('ArrowDown')||this.input.wasPressed('KeyS')){
      this.endSel=(this.endSel+1)%opts.length;this.audio.menuMove();
    }
    if(this.input.wasPressed('ArrowUp')||this.input.wasPressed('KeyW')){
      this.endSel=(this.endSel-1+opts.length)%opts.length;this.audio.menuMove();
    }
    if(this.input.wasPressed('Enter')||this.input.wasPressed('Space')||this.input.wasPressed('NumpadEnter')){
      this.audio.menuSelect();
      this.commitEndAction(opts[this.endSel]);
    }
    if(this.isOnlineHost())this.broadcastOnlineSnapshot();
  }

  startMatch(){
    this.state=STATE.PLAYING;
    this.audio.setThemeMode('game');
    this.bullets=[];this.powerups=[];this.landMines=[];this.ps=new ParticleSystem();this.tracks=[];
    this.onlineEvents=[];
    this.puTimer=PU_INTERVAL;this.matchOver=false;this.winner=null;
    this.killFeed=[];this.roundNum=0;this.mapIdx=0;
    const mapData=MAPS[0];
    this.arena.load(mapData);
    this.arena.loadTunnels(MAP_TUNNELS[0]);
    this.tanks.forEach((t,i)=>{
      t.kills=0;t.roundKills=0;t.alive=false;t.respawnTimer=0;
      t.shield=false;t.ghost=false;t.rapid=false;t.triple=false;t.bounceBonus=false;t.wallBreak=false;t.wallBreakTimer=0;
      t.respawn(this.arena);
      t.angle=i===0?0:Math.PI;
    });
    this.countdownVal=3;this.countdownTimer=0;this.gameReady=false;
    this._prevRoundKills=[0,0];
    if(this.isOnlineMode()){
      this.online.snapshotTimer=0;
      this.online.inputTimer=0;
      this.online.lastInputSig='';
      this.online.remoteFireHeld=false;
    }
  }

  goEnd(){
    this.state=STATE.END;
    this.audio.setThemeMode('title');
    this.endTimer=0;this.endSel=0;
    // Fire celebratory particles
    const w=this.winner;
    if(w){
      for(let i=0;i<12;i++){
        setTimeout(()=>{
          const x=Math.random()*W,y=HUD+Math.random()*AH;
          this.ps.emit(x,y,w.col,18,9,5,55);
          this.ps.emit(x,y,'#ffdd00',8,11,3,45);
        },i*150);
      }
    }
    if(this.isOnlineHost())this.broadcastOnlineSnapshot(true);
  }
  getEndOptions(){
    if(!this.isOnlineMode())return['REMATCH','CHANGE TANKS','MAIN MENU'];
    return this.isOnlineHost()?['REMATCH','CHANGE TANKS','MAIN MENU']:['LEAVE ROOM'];
  }
  commitEndAction(action){
    if(action==='REMATCH'){
      this.mapIdx=0;
      this.tanks[0].kills=0;this.tanks[1].kills=0;
      this.startMatch();
      return;
    }
    if(action==='CHANGE TANKS'){
      if(this.isOnlineHost())this.onlineSession?.send('GAME_EVENT',{event:{kind:'END_ACTION',action:'select'}});
      this.goSelect();
      return;
    }
    if(action==='MAIN MENU'||action==='LEAVE ROOM'){
      if(this.isOnlineHost())this.onlineSession?.send('GAME_EVENT',{event:{kind:'END_ACTION',action:'menu'}});
      this.goMenu('Room closed.');
    }
  }
  sendOnlineInput(){
    if(!this.onlineSession||!this.isOnlineGuest())return;
    this.online.inputTimer-=this.dt;
    const input=this.getOnlineInputState(this.online.playerNum);
    const sig=JSON.stringify(input);
    if(sig===this.online.lastInputSig&&this.online.inputTimer>0)return;
    this.online.lastInputSig=sig;
    this.online.inputTimer=INPUT_SEND_MS;
    this.onlineSession.send('INPUT',{input,t:this.now});
  }
  broadcastOnlineSnapshot(force=false){
    if(!this.onlineSession||!this.isOnlineHost())return;
    this.online.snapshotTimer-=this.dt;
    if(!force&&this.online.snapshotTimer>0)return;
    this.online.snapshotTimer=SNAPSHOT_MS;
    this.onlineSession.send('GAME_EVENT',{event:{kind:'SNAPSHOT',snapshot:this.serializeOnlineSnapshot()}});
  }
  serializeTankState(tank){
    return{
      type:tank.type,x:+tank.x.toFixed(2),y:+tank.y.toFixed(2),angle:+tank.angle.toFixed(4),
      playerNum:tank.playerNum,isCPU:tank.isCPU,alive:tank.alive,kills:tank.kills,roundKills:tank.roundKills,
      respawnTimer:tank.respawnTimer,lastFireTime:tank.lastFireTime,shield:tank.shield,ghost:tank.ghost,
      ghostTimer:tank.ghostTimer,rapid:tank.rapid,rapidTimer:tank.rapidTimer,triple:tank.triple,
      tripleTimer:tank.tripleTimer,bounceBonus:tank.bounceBonus,bounceTimer:tank.bounceTimer,
      wallBreak:tank.wallBreak,wallBreakTimer:tank.wallBreakTimer,
      muzzleFlash:tank.muzzleFlash,moveAnim:tank.moveAnim,
    };
  }
  restoreTankState(state){
    const tank=new Tank(state.type,state.x,state.y,state.angle,this.getPlayerControls(state.playerNum),state.playerNum,!!state.isCPU);
    Object.assign(tank,state);
    return tank;
  }
  serializeBulletState(bullet){
    return{
      x:+bullet.x.toFixed(2),y:+bullet.y.toFixed(2),vx:+bullet.vx.toFixed(2),vy:+bullet.vy.toFixed(2),
      maxBounces:bullet.maxBounces,bounces:bullet.bounces,active:bullet.active,col:bullet.col,age:bullet.age,
      wallBreak:bullet.wallBreak,
      ownerPlayer:bullet.owner.playerNum,trail:bullet.trail.map(pt=>({x:+pt.x.toFixed(2),y:+pt.y.toFixed(2)})),
    };
  }
  restoreBulletState(state,owner){
    const bullet=new Bullet(state.x,state.y,0,owner,state.maxBounces,state.col,!!state.wallBreak);
    bullet.vx=state.vx;bullet.vy=state.vy;bullet.bounces=state.bounces;bullet.active=state.active;
    bullet.age=state.age;bullet.trail=(state.trail||[]).map(pt=>({x:pt.x,y:pt.y}));
    return bullet;
  }
  serializePowerUpState(powerup){
    return{x:powerup.x,y:powerup.y,type:powerup.type,active:powerup.active,t:powerup.t};
  }
  restorePowerUpState(state){
    const powerup=new PowerUp(state.x,state.y,state.type);
    powerup.active=state.active;
    powerup.t=state.t;
    return powerup;
  }
  serializeOnlineSnapshot(){
    const events=this.onlineEvents.splice(0);
    return{
      state:this.state===STATE.END?'END':'PLAYING',
      roundNum:this.roundNum,mapIdx:this.mapIdx,map:this.arena.grid,tunnels:this.arena.tunnels,
      gameReady:this.gameReady,countdownVal:this.countdownVal,countdownTimer:this.countdownTimer,
      matchOver:this.matchOver,winTimer:this.winTimer,endTimer:this.endTimer,puTimer:this.puTimer,
      killFeed:this.killFeed.map(item=>({...item})),p1Sel:this.p1Sel,p2Sel:this.p2Sel,p1Ready:this.p1Ready,p2Ready:this.p2Ready,
      tanks:this.tanks.map(t=>this.serializeTankState(t)),
      bullets:this.bullets.filter(b=>b.active&&!b.isShrapnel).map(b=>this.serializeBulletState(b)),
      powerups:this.powerups.filter(p=>p.active).map(p=>this.serializePowerUpState(p)),
      landMines:this.landMines.filter(m=>m.active).map(m=>({x:m.x,y:m.y,owner:m.ownerPlayerNum,armed:m.armed})),
      winnerPlayerNum:this.winner?this.winner.playerNum:null,
      events,
    };
  }
  applyOnlineSnapshot(snapshot){
    if(!snapshot)return;
    this.gameMode='online';
    this.singlePlayer=false;
    this.input.setTouchPlayerNum(this.online.playerNum);
    this.state=snapshot.state==='END'?STATE.END:STATE.PLAYING;
    if(snapshot.map)this.arena.load(snapshot.map);
    this.arena.tunnels=snapshot.tunnels||[];
    this.roundNum=snapshot.roundNum||0;
    this.mapIdx=snapshot.mapIdx||0;
    this.gameReady=!!snapshot.gameReady;
    this.countdownVal=snapshot.countdownVal||0;
    this.countdownTimer=snapshot.countdownTimer||0;
    this.matchOver=!!snapshot.matchOver;
    this.winTimer=snapshot.winTimer||0;
    this.endTimer=snapshot.endTimer||0;
    this.puTimer=snapshot.puTimer||PU_INTERVAL;
    this.killFeed=(snapshot.killFeed||[]).map(item=>({...item}));
    this.p1Sel=snapshot.p1Sel??0;
    this.p2Sel=snapshot.p2Sel??1;
    this.p1Ready=!!snapshot.p1Ready;
    this.p2Ready=!!snapshot.p2Ready;
    this.tanks=(snapshot.tanks||[]).map(state=>this.restoreTankState(state));
    const tankMap=new Map(this.tanks.map(t=>[t.playerNum,t]));
    this.bullets=(snapshot.bullets||[]).map(state=>this.restoreBulletState(state,tankMap.get(state.ownerPlayer)||this.tanks[0]));
    this.powerups=(snapshot.powerups||[]).map(state=>this.restorePowerUpState(state));
    this.landMines=(snapshot.landMines||[]).map(s=>{const m=new LandMine(s.x,s.y,s.owner);if(s.armed)m.armTimer=0;return m;});
    this.winner=snapshot.winnerPlayerNum?tankMap.get(snapshot.winnerPlayerNum)||null:null;
    this._prevRoundKills=this.tanks.map(t=>t.roundKills);
    // Replay visual events from host
    for(const ev of (snapshot.events||[])){
      if(ev.type==='death'){
        this.ps.emit(ev.x,ev.y,'#ffffff',24,16,5,7);
        this.ps.emit(ev.x,ev.y,'#ffff99',20,13,6,12);
        this.ps.emit(ev.x,ev.y,'#ff9900',28,10,8,30);
        this.ps.emit(ev.x,ev.y,'#ff5500',24,8,9,40);
        this.ps.emit(ev.x,ev.y,'#cc1100',18,12,6,22);
        for(let i=0;i<6;i++)this.ps.emit(ev.x,ev.y,ev.col,5,7+i*1.5,4+i,45+i*10);
        this.ps.emit(ev.x,ev.y,'#1a1a1a',14,3,14,80);
        this.ps.emit(ev.x,ev.y,'#333333',12,2,18,100);
        this.ps.emit(ev.x,ev.y,'#ffcc00',16,14,2,18);
        this.audio.explode((ev.x/W)*2-1);
        this.addShake(2.5);
      }else if(ev.type==='shieldHit'){
        this.ps.emit(ev.x,ev.y,'#ffffff',12,4,3,18);
        this.audio.hit();
      }else if(ev.type==='teleport'){
        this.ps.emit(ev.x1,ev.y1,ev.col,14,5,3,28);
        this.ps.emit(ev.x2,ev.y2,ev.col,14,5,3,28);
      }else if(ev.type==='roundWin'){
        for(let i=0;i<8;i++){
          setTimeout(()=>{
            const a=Math.random()*W,b=HUD+Math.random()*AH;
            this.ps.emit(a,b,ev.col,20,8,5,50);
            this.ps.emit(a,b,'#ffdd00',10,10,3,40);
          },i*200);
        }
        this.audio.victoryFanfare();
        this.addShake(2);
      }else if(ev.type==='powerup'){
        this.audio.powerup();
      }
    }
  }

  /* ══════════════════════════════════════════════
     DRAW dispatcher
  ══════════════════════════════════════════════ */
  draw(){
    const ctx=this.ctx;
    ctx.save();
    if(this.shakeX||this.shakeY)ctx.translate(this.shakeX,this.shakeY);
    ctx.fillStyle=PAL.bg;ctx.fillRect(-10,-10,W+20,H+20);
    switch(this.state){
      case STATE.BOOT:    this.drawBoot(ctx);   break;
      case STATE.SPLASH:  this.drawSplash(ctx); break;
      case STATE.MENU:    this.drawMenu(ctx);   break;
      case STATE.SELECT:  this.drawSelect(ctx); break;
      case STATE.PLAYING: this.drawPlay(ctx);   break;
      case STATE.END:     this.drawEnd(ctx);    break;
      case STATE.LOBBY:   this.drawLobby(ctx);  break;
      case STATE.PAUSE:   this.drawPause(ctx);  break;
    }
    ctx.restore();
  }

  /* ─── TEXT HELPERS ────────────────────────────── */
  txt(ctx,str,x,y,sz,col,align='center',shadow=null){
    ctx.font=`${sz}px "Press Start 2P"`;
    ctx.textAlign=align;ctx.textBaseline='middle';
    if(shadow){ctx.shadowColor=shadow;ctx.shadowBlur=10;}
    ctx.fillStyle=col;ctx.fillText(str,x,y);
    ctx.shadowBlur=0;
  }
  glow(ctx,col,blur=12){ctx.shadowColor=col;ctx.shadowBlur=blur;}

  /* ══════════════════════════════════════════════
     DRAW BOOT
  ══════════════════════════════════════════════ */
  drawBoot(ctx){
    const noise=ctx.createImageData(W,H);
    for(let i=0;i<noise.data.length;i+=4){
      const v=6+Math.random()*26;
      noise.data[i]=noise.data[i+1]=noise.data[i+2]=v;noise.data[i+3]=255;
    }
    ctx.putImageData(noise,0,0);
    ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.fillRect(0,0,W,H);
    ctx.font='24px "Press Start 2P"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const grad=ctx.createLinearGradient(W/2-180,0,W/2+180,0);
    grad.addColorStop(0,'#cc7700');grad.addColorStop(.5,'#ffee88');grad.addColorStop(1,'#cc7700');
    ctx.fillStyle=grad;ctx.shadowColor='#ffaa00';ctx.shadowBlur=18;
    ctx.fillText('TANK TACTICS',W/2,120);
    ctx.shadowBlur=0;
    ctx.font='11px "Press Start 2P"';
    ctx.fillStyle='#7a7aa0';
    ctx.fillText('RETRO RELOAD',W/2,158);

    ctx.font='13px "Press Start 2P"';
    ctx.textAlign='left';ctx.textBaseline='top';
    const startY=240;
    this.bootLines.forEach((line,i)=>{
      const isLaunch=line==='CLICK TO LAUNCH...';
      const blink=!isLaunch||this.bootTimer%1000<550;
      if(!blink)return;
      ctx.fillStyle=isLaunch?PAL.green:'rgba(0,255,136,0.92)';
      ctx.shadowColor=isLaunch?PAL.green:'#00ff88';
      ctx.shadowBlur=isLaunch?12:8;
      ctx.fillText('> '+line,120,startY+i*34);
    });

    if(this.bootLineIdx<this.bootSequence.length){
      const current=this.bootSequence[this.bootLineIdx].slice(0,this.bootCharIdx);
      const cursor=Math.floor(this.now/400)%2===0?'_':'';
      ctx.fillStyle=this.bootLineIdx===this.bootSequence.length-1?PAL.green:'rgba(0,255,136,0.96)';
      ctx.shadowColor=this.bootLineIdx===this.bootSequence.length-1?PAL.green:'#00ff88';
      ctx.shadowBlur=10;
      ctx.fillText('> '+current+cursor,120,startY+this.bootLineIdx*34);
    }
    ctx.shadowBlur=0;

    ctx.font='8px "Press Start 2P"';
    ctx.textAlign='center';
    ctx.fillStyle=PAL.dim;
    ctx.fillText('THEME SONG STARTS WHEN YOU CLICK LAUNCH',W/2,H-68);
    ctx.fillText('P1: WASD + SPACE     P2: ARROWS + ENTER',W/2,H-42);
  }

  /* ══════════════════════════════════════════════
     DRAW SPLASH
  ══════════════════════════════════════════════ */
  drawSplash(ctx){
    const t=this.splashTimer;
    // Animated background grid
    ctx.fillStyle=PAL.floor;ctx.fillRect(0,0,W,H);
    const scroll=(t*.02)%TS;
    ctx.strokeStyle='rgba(20,20,50,.8)';ctx.lineWidth=1;
    for(let x=-TS+scroll;x<W+TS;x+=TS){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=TS){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    // Two tanks facing each other
    ctx.save();
    ctx.translate(160,H/2+20);ctx.rotate(-Math.PI/2);
    this.drawMiniTank(ctx,'#d42020','#6e0e0e',t);
    ctx.restore();
    ctx.save();
    ctx.translate(W-160,H/2+20);ctx.rotate(Math.PI/2);
    this.drawMiniTank(ctx,'#18a818','#085808',t);
    ctx.restore();

    // Title with glitch
    const glitch=Math.random()<.03?Math.random()*4-2:0;
    // Shadow text
    ctx.font='38px "Press Start 2P"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,.7)';
    ctx.fillText('TANK TACTICS',W/2+3,H/2-78+3);
    // Main title
    const tGrad=ctx.createLinearGradient(W/2-200,0,W/2+200,0);
    tGrad.addColorStop(0,'#cc8800');tGrad.addColorStop(.5,'#ffee88');tGrad.addColorStop(1,'#cc8800');
    ctx.shadowColor='#ffaa00';ctx.shadowBlur=20;
    ctx.fillStyle=tGrad;
    ctx.fillText('TANK TACTICS',W/2+glitch,H/2-78);
    ctx.shadowBlur=0;
    // Subtitle
    ctx.font='24px "Press Start 2P"';
    ctx.fillStyle='#8888aa';
    ctx.fillText('RETRO  RELOAD',W/2,H/2-42);
    // Version tag
    ctx.font='9px "Press Start 2P"';
    ctx.fillStyle=PAL.dim;
    ctx.fillText('v1.0',W/2+120,H/2-42);

    // Flashing prompt
    if(this.splashBlink){
      this.glow(ctx,PAL.green,12);
      this.txt(ctx,'PRESS ANY KEY',W/2,H/2+60,13,PAL.green);
      ctx.shadowBlur=0;
    }

    // Controls hint
    ctx.font='9px "Press Start 2P"';
    ctx.fillStyle=PAL.dim;
    ctx.textAlign='center';
    ctx.fillText('P1: WASD + SPACE',W/2,H/2+108);
    ctx.fillText('P2: ARROWS + ENTER',W/2,H/2+126);
    if(this.input.shouldShowTouchControls())ctx.fillText('TOUCH: STICK + FIRE',W/2,H/2+144);
    ctx.fillText('ROUND: FIRST TO '+ROUND_KILLS_TO_WIN+' KILLS',W/2,H/2+168);
    ctx.fillText('MATCH: FIRST TO '+KILLS_WIN+' ROUNDS',W/2,H/2+186);

    // Bottom credits
    ctx.font='8px "Press Start 2P"';ctx.fillStyle='#2a2a44';
    ctx.fillText('© TANK TACTICS RETRO RELOAD',W/2,H-20);
  }

  drawMiniTank(ctx,col,dark,t){
    const bob=Math.sin(t*.002)*3;
    const turretRot=Math.sin(t*.0015)*.3;
    ctx.translate(0,bob);
    ctx.fillStyle='#111';ctx.fillRect(-17,-14,7,28);ctx.fillRect(10,-14,7,28);
    ctx.fillStyle=dark; ctx.fillRect(-10,-13,20,26);
    ctx.fillStyle=col;  ctx.fillRect(-9,-12,18,24);
    ctx.fillStyle=dark; ctx.fillRect(-9,-2,18,4);
    ctx.save();ctx.rotate(turretRot);
    ctx.fillStyle=dark; ctx.fillRect(-6,-6,12,12);
    ctx.fillStyle=col;  ctx.fillRect(-5,-5,10,10);
    ctx.fillStyle=dark; ctx.fillRect(-3.5,-20,7,20);
    ctx.fillStyle='#444';ctx.fillRect(-2.5,-20,5,19);
    ctx.restore();
  }

  /* ══════════════════════════════════════════════
     DRAW MENU
  ══════════════════════════════════════════════ */
  drawMenu(ctx){
    if(this.attractMode){this.drawAttract(ctx);return;}
    const t=this.now;
    // Animated BG
    ctx.fillStyle=PAL.floor;ctx.fillRect(0,0,W,H);
    const s=(t*.015)%TS;
    ctx.strokeStyle='rgba(18,18,38,.9)';ctx.lineWidth=.8;
    for(let x=-s;x<W;x+=TS){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+200,H);ctx.stroke();}

    // Title
    ctx.font='24px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
    const tg=ctx.createLinearGradient(W/2-150,0,W/2+150,0);
    tg.addColorStop(0,'#cc7700');tg.addColorStop(.5,'#ffee88');tg.addColorStop(1,'#cc7700');
    ctx.shadowColor='#ffaa00';ctx.shadowBlur=14;
    ctx.fillStyle=tg;ctx.fillText('TANK TACTICS',W/2,90);
    ctx.font='18px "Press Start 2P"';ctx.fillStyle='#666688';ctx.shadowBlur=0;
    ctx.fillText('RETRO RELOAD',W/2,118);

    // Menu items
    const {items,selectedKey,label}=this.getActiveMenuContext();
    const selected=this[selectedKey];
    const {startY,gap,statusY,noticeY,hintText,touchHint}=this.getMenuLayout();
    if(this.menuMode==='share'){
      const card={x:92,y:156,w:416,h:520};
      ctx.fillStyle='rgba(6,12,24,.88)';
      ctx.fillRect(card.x,card.y,card.w,card.h);
      ctx.strokeStyle='rgba(0,255,136,.22)';
      ctx.lineWidth=2;
      ctx.strokeRect(card.x,card.y,card.w,card.h);
      ctx.fillStyle='rgba(0,255,136,.05)';
      ctx.fillRect(card.x+20,card.y+20,card.w-40,card.h-40);
      this.glow(ctx,PAL.green,10);
      this.txt(ctx,'SCAN TO SHARE',W/2,card.y+34,10,PAL.green);
      ctx.shadowBlur=0;

      const qrBox={x:W/2-142,y:card.y+74,w:284,h:284};
      ctx.fillStyle='#f4f6ff';
      ctx.fillRect(qrBox.x,qrBox.y,qrBox.w,qrBox.h);
      ctx.strokeStyle='rgba(255,255,255,.2)';
      ctx.strokeRect(qrBox.x,qrBox.y,qrBox.w,qrBox.h);
      if(this.shareQrImage&&this.shareQrStatus==='ready'){
        ctx.drawImage(this.shareQrImage,qrBox.x+12,qrBox.y+12,qrBox.w-24,qrBox.h-24);
      }else{
        ctx.fillStyle='#11182a';
        ctx.fillRect(qrBox.x+12,qrBox.y+12,qrBox.w-24,qrBox.h-24);
        ctx.font='9px "Press Start 2P"';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=this.shareQrStatus==='error'?PAL.red:PAL.dim;
        ctx.fillText(this.shareQrStatus==='error'?'QR LOAD FAILED':'LOADING QR...',W/2,qrBox.y+qrBox.h/2);
      }

      const shareUrl=this.getShareUrl();
      let shareHost=shareUrl;
      try{shareHost=new URL(shareUrl).host;}catch(e){}
      ctx.font='8px "Press Start 2P"';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=PAL.dim;
      ctx.fillText('OPEN THE CAMERA APP AND SCAN',W/2,card.y+394);
      ctx.fillStyle=PAL.white;
      ctx.fillText(shareHost.toUpperCase(),W/2,card.y+432);
      ctx.fillStyle=PAL.dim;
      ctx.fillText('OR USE COPY LINK BELOW',W/2,card.y+466);
    }
    // ── Power-ups reference screen ──────────────────────────────
    if(this.menuMode==='powerups'){
      const PU_DESCS={
        RAPID:   'Hold fire to shoot\ncontinuously at rapid pace',
        TRIPLE:  'Each shot fires 3 bullets\nin a spread pattern',
        SHIELD:  'Absorbs one hit\ncompletely — then gone',
        BOUNCE:  'Bullets ricochet off walls\nup to 6 extra times',
        BREACH:  'Bullets blast through\nand destroy wall segments',
        GHOST:   'Tank phases through walls\nand obstacles',
        SHRAPNEL:'Bullets explode on wall impact\nsending ghost shards through barriers',
        HSPEED:  '2x speed boost — gauge\nonly drains while moving',
        RADAR:   'Night Mode only: 3 expanding\npulse rings reveal map & enemies',
        MINE:    'Hold fire 3s to place a mine\nbehind tank. 3 mines. Kills anyone.',
      };
      const keys=Object.keys(PU_DEF);
      // Subtitle sits below the existing "RETRO RELOAD" header — no overlap
      ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#444466';
      ctx.fillText('— POWER-UP GUIDE —',W/2,136);
      // Thin separator line
      ctx.strokeStyle='#222244';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(24,146);ctx.lineTo(W-24,146);ctx.stroke();
      const cardH=86, cardW=W-48, cardX=24;
      const startCard=152;
      ctx.shadowBlur=0;
      keys.forEach((key,i)=>{
        const def=PU_DEF[key];
        const cy=startCard+i*cardH;
        const ch=cardH-5;
        // Night-mode-only badge tint for RADAR
        const isNightOnly=key==='RADAR';
        // Card bg
        ctx.fillStyle=isNightOnly?'rgba(10,10,30,0.9)':'rgba(8,8,22,0.85)';
        ctx.fillRect(cardX,cy,cardW,ch);
        ctx.strokeStyle=def.col+(isNightOnly?'88':'55');ctx.lineWidth=isNightOnly?2:1.5;
        ctx.strokeRect(cardX,cy,cardW,ch);

        ctx.shadowColor=def.col;ctx.shadowBlur=12;
        ctx.fillStyle=def.col+'33';
        ctx.beginPath();ctx.arc(ix,iy,22,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=def.col;ctx.lineWidth=2;
        ctx.beginPath();ctx.arc(ix,iy,22,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=def.col;
        ctx.font='bold 10px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(def.icon,ix,iy);
        ctx.shadowBlur=0;
        // Name
        ctx.fillStyle=def.col;
        ctx.font='10px "Press Start 2P"';ctx.textAlign='left';ctx.textBaseline='top';
        ctx.fillText(def.label,cardX+72,cy+12);

        const lines=PU_DESCS[key].split('\n');
        ctx.fillStyle='#8888aa';ctx.font='8px "Press Start 2P"';
        lines.forEach((ln,li)=>ctx.fillText(ln,cardX+72,cy+32+li*17));
        // Duration / night badge
        const durTxt=key==='HSPEED'?'FUEL-BASED':key==='RADAR'?'☾ NIGHT ONLY':key==='MINE'?'3 MINES':def.dur===0?'PERMANENT':Math.round(def.dur/1000)+'s';
        ctx.fillStyle=isNightOnly?'#334488':'#333355';ctx.font='7px "Press Start 2P"';
        ctx.textAlign='right';ctx.textBaseline='bottom';
        ctx.fillText(durTxt,cardX+cardW-8,cy+ch-5);
      });
      // Back hint
      ctx.font='7px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle=PAL.dim;ctx.textBaseline='middle';
      ctx.fillText('TAP ANYWHERE  •  ESC TO RETURN',W/2,H-28);
      return;
    }

    items.forEach((item,i)=>{
      const y=startY+i*gap;
      const sel=i===selected;
      const dim=item.dim;

      if(sel&&!dim){
        // Selection box
        ctx.fillStyle='rgba(0,255,136,.07)';
        ctx.fillRect(W/2-160,y-18,320,36);
        ctx.strokeStyle='rgba(0,255,136,.3)';ctx.lineWidth=1;
        ctx.strokeRect(W/2-160,y-18,320,36);
        // Arrow
        ctx.font='11px "Press Start 2P"';ctx.fillStyle=PAL.green;
        this.glow(ctx,PAL.green,10);
        ctx.textAlign='left';
        ctx.fillText('▶',W/2-148,y);
        ctx.textAlign='center';
      }

      const col=dim?'#333355':sel?PAL.green:PAL.white;
      if(sel&&!dim)this.glow(ctx,PAL.green,8);
      ctx.font='13px "Press Start 2P"';ctx.textAlign='center';
      ctx.fillStyle=col;ctx.fillText(this.resolveMenuLabel(item),W/2,y);
      if(dim){
        ctx.font='8px "Press Start 2P"';ctx.fillStyle='#333355';
        ctx.fillText('COMING SOON',W/2,y+16);
      }else if(item.note){
        ctx.font='8px "Press Start 2P"';ctx.fillStyle=sel?PAL.dim:'#333355';
        ctx.fillText(item.note,W/2,y+16);
      }
      ctx.shadowBlur=0;
    });

    // Settings status
    ctx.font='9px "Press Start 2P"';ctx.textAlign='center';
    ctx.fillStyle=PAL.dim;
    ctx.fillText(label,W/2,statusY);
    const notice=this.menuMode==='share'?this.shareNotice:this.menuNotice;
    if(notice){
      ctx.fillStyle=PAL.yellow;
      ctx.fillText(notice,W/2,noticeY);
    }

    // Bottom hint
    ctx.font='9px "Press Start 2P"';ctx.fillStyle=PAL.dim;
    if(this.input.shouldShowTouchControls()){
      ctx.fillText(touchHint,W/2,H-30);
    }else{
      ctx.fillText(hintText,W/2,H-30);
    }
  }

  drawLobby(ctx){
    ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#0e0e1e';ctx.fillRect(0,0,W,72);
    this.glow(ctx,PAL.yellow,10);
    this.txt(ctx,'ONLINE ROOM',W/2,36,13,PAL.yellow);
    ctx.shadowBlur=0;

    const card={x:70,y:160,w:460,h:250};
    ctx.fillStyle='rgba(255,255,255,.03)';
    ctx.fillRect(card.x,card.y,card.w,card.h);
    ctx.strokeStyle='rgba(0,255,136,.22)';
    ctx.lineWidth=2;
    ctx.strokeRect(card.x,card.y,card.w,card.h);

    ctx.font='9px "Press Start 2P"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=PAL.dim;
    ctx.fillText('SHARE THIS INVITE CODE',W/2,206);

    const codeRect=this.getLobbyCodeRect();
    ctx.fillStyle='rgba(0,255,136,.08)';
    ctx.fillRect(codeRect.x,codeRect.y,codeRect.w,codeRect.h);
    ctx.strokeStyle='rgba(0,255,136,.32)';
    ctx.strokeRect(codeRect.x,codeRect.y,codeRect.w,codeRect.h);
    this.glow(ctx,PAL.green,16);
    this.txt(ctx,this.online.roomCode||'....',W/2,codeRect.y+codeRect.h/2+2,18,PAL.green);
    ctx.shadowBlur=0;

    ctx.fillStyle=PAL.white;
    ctx.font='8px "Press Start 2P"';
    ctx.fillText(this.online.status||'WAITING FOR PLAYER 2...',W/2,346);
    ctx.fillStyle=PAL.dim;
    ctx.fillText('TAP THE CODE TO COPY IT AGAIN',W/2,374);

    const cancel=this.getLobbyCancelRect();
    ctx.fillStyle='rgba(255,64,64,.08)';
    ctx.fillRect(cancel.x,cancel.y,cancel.w,cancel.h);
    ctx.strokeStyle='rgba(255,64,64,.25)';
    ctx.strokeRect(cancel.x,cancel.y,cancel.w,cancel.h);
    ctx.fillStyle=PAL.red;
    ctx.font='18px "Press Start 2P"';
    ctx.fillText('CANCEL',cancel.x+cancel.w/2,cancel.y+cancel.h/2+1);

    ctx.font='9px "Press Start 2P"';
    ctx.fillStyle=PAL.dim;
    ctx.fillText(this.input.shouldShowTouchControls()?'TAP CODE TO COPY   TAP CANCEL TO LEAVE':'ENTER COPY CODE   ESC CANCEL',W/2,H-32);
  }

  /* ══════════════════════════════════════════════
     DRAW SELECT
  ══════════════════════════════════════════════ */
  drawSelect(ctx){
    const t=this.now;
    ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
    // Header
    ctx.fillStyle='#0e0e1e';ctx.fillRect(0,0,W,58);
    this.glow(ctx,PAL.yellow,8);
    this.txt(ctx,'SELECT YOUR TANK',W/2,29,11,PAL.yellow);
    ctx.shadowBlur=0;
    if(this.input.shouldShowTouchControls()){
      const back=this.getSelectBackRect();
      ctx.fillStyle='rgba(0,255,136,.06)';
      ctx.fillRect(back.x,back.y,back.w,back.h);
      ctx.strokeStyle='rgba(0,255,136,.24)';
      ctx.lineWidth=1;
      ctx.strokeRect(back.x,back.y,back.w,back.h);
      ctx.font='8px "Press Start 2P"';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=PAL.green;
      ctx.fillText('BACK',back.x+back.w/2,back.y+back.h/2+1);
    }

    const tankW=250,tankH=240;
    const gapX=18,gapY=18;
    const startX=(W-(tankW*2+gapX))/2;
    const startY=86;

    TANK_ORDER.forEach((type,i)=>{
      const def=TANK_DEF[type];
      const col=i%2,row=Math.floor(i/2);
      const x=startX+col*(tankW+gapX);
      const y=startY+row*(tankH+gapY);
      const p1=(i===this.p1Sel);const p2=(i===this.p2Sel);
      const p1r=this.p1Ready&&p1;const p2r=this.p2Ready&&p2;

      // Card BG
      ctx.fillStyle=p1||p2?'rgba(255,255,255,.05)':'rgba(255,255,255,.02)';
      ctx.fillRect(x,y,tankW,tankH);
      ctx.strokeStyle=p1&&p2?'#ffdd00':p1?def.col:p2?def.col:'#1a1a3a';
      ctx.lineWidth=p1||p2?2:1;
      ctx.strokeRect(x,y,tankW,tankH);

      // Tank drawing
      ctx.save();ctx.translate(x+tankW/2,y+72);ctx.rotate(-Math.PI/2);
      const sc=1+((p1||p2)?0.08:0);ctx.scale(sc,sc);
      // Draw full tank
      const bob=(p1||p2)?Math.sin(t*.003)*4:0;
      ctx.translate(0,bob);
      ctx.fillStyle='#111';ctx.fillRect(-17,-14,7,28);ctx.fillRect(10,-14,7,28);
      ctx.fillStyle=def.dark;ctx.fillRect(-10,-13,20,26);
      ctx.fillStyle=def.col; ctx.fillRect(-9,-12,18,24);
      ctx.fillStyle=def.dark;ctx.fillRect(-9,-2,18,4);
      ctx.fillStyle=def.dark;ctx.fillRect(-6,-6,12,12);
      ctx.fillStyle=def.col; ctx.fillRect(-5,-5,10,10);
      ctx.fillStyle=def.dark;ctx.fillRect(-3.5,-20,7,20);
      ctx.fillStyle='#555'; ctx.fillRect(-2.5,-20,5,19);
      ctx.restore();

      // Name
      ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=def.col;ctx.shadowColor=def.col;ctx.shadowBlur=8;
      ctx.fillText(def.name,x+tankW/2,y+128);ctx.shadowBlur=0;

      // Stats bars
      const stats=[
        {label:'SPD',val:def.speed/3},
        {label:'ROF',val:1-(def.fireMs-600)/600},
        {label:'RIC',val:def.bounces},
      ];
      stats.forEach((s,si)=>{
        const bx=x+16,by=y+148+si*22;
        ctx.font='8px "Press Start 2P"';ctx.fillStyle=PAL.dim;ctx.textAlign='left';
        ctx.fillText(s.label,bx,by+4);
        ctx.fillStyle='#0f0f1f';ctx.fillRect(bx+24,by,tankW-48,8);
        ctx.fillStyle=def.col;ctx.fillRect(bx+24,by,Math.max(4,(tankW-48)*s.val),8);
      });

      // Trait
      ctx.font='6px "Press Start 2P"';ctx.textAlign='center';
      ctx.fillStyle='#555577';
      const words=['POWER UPS DEFINE THE EDGE',def.trait.toUpperCase()];
      words.forEach((w,wi)=>ctx.fillText(w.trim(),x+tankW/2,y+214+wi*12));

      // Player indicators
      if(p1){
        ctx.font='9px "Press Start 2P"';ctx.textAlign='center';
        ctx.fillStyle=p1r?PAL.green:TANK_DEF.RED.col;
        ctx.shadowColor=p1r?PAL.green:TANK_DEF.RED.col;ctx.shadowBlur=8;
        ctx.fillText(p1r?'P1 OK':'P1',x+tankW/2-28,y+tankH-16);
        ctx.shadowBlur=0;
      }
      if(p2){
        ctx.font='9px "Press Start 2P"';ctx.textAlign='center';
        ctx.fillStyle=p2r?PAL.green:TANK_DEF.GREEN.col;
        ctx.shadowColor=p2r?PAL.green:TANK_DEF.GREEN.col;ctx.shadowBlur=8;
        const p2Label=this.singlePlayer?(p2?'CPU':''):p2r?'P2 OK':'P2';
        ctx.fillText(p2Label,x+tankW/2+28,y+tankH-16);
        ctx.shadowBlur=0;
      }
    });

    // Control hints
    ctx.font='9px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
    if(this.isOnlineMode()){
      const localPlayer=this.getOnlineLocalPlayer();
      const localReady=localPlayer===1?this.p1Ready:this.p2Ready;
      const remoteReady=localPlayer===1?this.p2Ready:this.p1Ready;
      ctx.fillStyle=localReady?PAL.green:'#556666';
      this.glow(ctx,localReady?PAL.green:'transparent',6);
      ctx.fillText(localPlayer===1?'P1: A/D SELECT   SPACE CONFIRM':'P2: ◀▶ SELECT   ENTER CONFIRM',W/2,H-56);
      ctx.shadowBlur=0;
      ctx.fillStyle=remoteReady?PAL.green:'#556666';
      ctx.fillText(remoteReady?'REMOTE TANK LOCKED IN':'WAITING FOR OTHER PLAYER',W/2,H-34);
    }else{
      ctx.fillStyle=this.p1Ready?PAL.green:'#556666';
      this.glow(ctx,this.p1Ready?PAL.green:'transparent',6);
      ctx.fillText(this.singlePlayer?'P1: A/D SELECT   SPACE LOCK IN':'P1: A/D SELECT   SPACE CONFIRM',W/2,H-56);
      ctx.shadowBlur=0;
      ctx.fillStyle=this.p2Ready?PAL.green:'#556666';
      this.glow(ctx,this.p2Ready?PAL.green:'transparent',6);
      ctx.fillText(this.singlePlayer?'CPU AUTO-SELECTS THE RIVAL TANK':'P2: ◀▶ SELECT   ENTER CONFIRM',W/2,H-34);
    }
    if(this.input.shouldShowTouchControls()){
      ctx.fillStyle='#556666';
      ctx.fillText('TAP CARD TO CHOOSE   TAP AGAIN TO LOCK IN',W/2,H-14);
    }
    ctx.shadowBlur=0;
  }

  /* ══════════════════════════════════════════════
     DRAW PLAY
  ══════════════════════════════════════════════ */
  drawPlay(ctx){
    const t=this.now;
    const arenaMidY=HUD+AH/2;

    // HUD background
    ctx.fillStyle=PAL.hud;ctx.fillRect(0,0,W,HUD);
    ctx.strokeStyle='#1a1a35';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(0,HUD);ctx.lineTo(W,HUD);ctx.stroke();

    // Arena
    this.arena.draw(ctx,t);

    // Power-ups
    this.powerups.forEach(p=>p.draw(ctx));

    // Land mines — visible only to their owner; in local 2P or demo show all (shared screen)
    const sharedScreen=(!this.isOnlineMode()&&!this.singlePlayer)||this.demoMode;
    const localMinePN=this.isOnlineHost()?1:this.isOnlineGuest()?2:1;
    this.landMines.forEach(m=>{
      m.draw(ctx,sharedScreen||m.ownerPlayerNum===localMinePN);
    });

    // Tank tracks
    for(const tr of this.tracks){
      ctx.save();
      ctx.globalAlpha=tr.life*0.45;
      ctx.translate(tr.x,tr.y);ctx.rotate(tr.angle);
      // Left tread mark
      ctx.fillStyle=tr.col;
      ctx.fillRect(-17,-4,7,8);
      ctx.fillRect(10,-4,7,8);
      // Tread ridge detail
      ctx.fillStyle='rgba(0,0,0,0.45)';
      ctx.fillRect(-17,-2.5,7,1.5);
      ctx.fillRect(-17,1,7,1.5);
      ctx.fillRect(10,-2.5,7,1.5);
      ctx.fillRect(10,1,7,1.5);
      ctx.restore();
    }

    // Tanks
    this.tanks.forEach(tk=>tk.draw(ctx,t));

    // Bullets
    this.bullets.forEach(b=>b.draw(ctx));

    // Respawn flash
    this.tanks.forEach((tk,i)=>{
      if(!tk.alive&&tk.respawnTimer>0){
        const alpha=(.5+.5*Math.sin(t*.015))*(tk.respawnTimer/RESPAWN_MS);
        ctx.globalAlpha=alpha;
        this.glow(ctx,tk.col,16);
        ctx.font='18px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=tk.col;
        ctx.fillText('P'+(i+1)+' RESPAWNING…',W/2,i===0?ARENA_BOTTOM-90:HUD+90);
        ctx.globalAlpha=1;ctx.shadowBlur=0;
      }
    });

    // ── Night Mode fog overlay ───────────────────
    if(this.roundNum%NIGHT_ROUND_MOD===NIGHT_ROUND_MOD-1){
      this.drawNightFog(ctx);
    }

    // Particles — drawn after fog so explosions are always visible
    this.ps.draw(ctx);

    // ── HUD ─────────────────────────────────────
    const p1=this.tanks[0],p2=this.tanks[1];
    ctx.textBaseline='middle';

    // P1 – label top row, pips middle row
    ctx.textAlign='left';
    ctx.font='10px "Press Start 2P"';
    this.glow(ctx,TANK_DEF[p1.type].col,8);
    ctx.fillStyle=TANK_DEF[p1.type].col;
    ctx.fillText('P1',8,13);ctx.shadowBlur=0;
    for(let k=0;k<KILLS_WIN;k++){
      const filled=k<p1.kills;
      ctx.fillStyle=filled?TANK_DEF[p1.type].col:'#1a1a35';
      if(filled){ctx.shadowColor=TANK_DEF[p1.type].col;ctx.shadowBlur=5;}
      ctx.fillRect(8+k*13,29,9,9);
      ctx.shadowBlur=0;
    }
    this.drawPUBar(ctx,p1,8,47,false);

    // P2 – label top row, pips middle row
    ctx.textAlign='right';
    ctx.font='10px "Press Start 2P"';
    this.glow(ctx,TANK_DEF[p2.type].col,8);
    ctx.fillStyle=TANK_DEF[p2.type].col;
    ctx.fillText('P2',W-8,13);ctx.shadowBlur=0;
    for(let k=0;k<KILLS_WIN;k++){
      const filled=k<p2.kills;
      ctx.fillStyle=filled?TANK_DEF[p2.type].col:'#1a1a35';
      if(filled){ctx.shadowColor=TANK_DEF[p2.type].col;ctx.shadowBlur=5;}
      ctx.fillRect(W-17-k*13,29,9,9);
      ctx.shadowBlur=0;
    }
    this.drawPUBar(ctx,p2,W-8,47,true);

    // Pause button – bottom center
    if(this.canOpenPauseMenu()){
      const pauseRect=this.getPauseButtonRect();
      ctx.fillStyle='rgba(0,255,136,.07)';
      ctx.fillRect(pauseRect.x,pauseRect.y,pauseRect.w,pauseRect.h);
      ctx.strokeStyle='rgba(0,255,136,.22)';ctx.lineWidth=1;
      ctx.strokeRect(pauseRect.x,pauseRect.y,pauseRect.w,pauseRect.h);
      ctx.font='7px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=PAL.green;
      ctx.fillText('PAUSE',pauseRect.x+pauseRect.w/2,pauseRect.y+pauseRect.h/2+1);
    }

    // Center – round info (stacked, no overlap)
    const isNight=this.roundNum%NIGHT_ROUND_MOD===NIGHT_ROUND_MOD-1;
    ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle=isNight?'#6688cc':PAL.dim;
    ctx.fillText('RND '+(this.roundNum+1)+(isNight?'  ☾ NIGHT':'')+'   KILLS '+p1.roundKills+'-'+p2.roundKills,W/2,11);
    ctx.font='7px "Press Start 2P"';ctx.fillStyle='#2a2a44';
    ctx.fillText('ROUND TO '+ROUND_KILLS_TO_WIN+'   MATCH TO '+KILLS_WIN,W/2,24);
    if(this.isOnlineMode()){
      ctx.font='7px "Press Start 2P"';ctx.fillStyle='#556677';
      ctx.fillText('ROOM '+this.online.roomCode,W/2,37);
    }

    // Kill feed
    this.killFeed.forEach((kf,i)=>{
      const alpha=Math.min(1,kf.timer/500);
      ctx.globalAlpha=alpha;
      ctx.font='8px "Press Start 2P"';ctx.textAlign='center';
      ctx.fillStyle=kf.col;ctx.shadowColor=kf.col;ctx.shadowBlur=6;
      ctx.fillText(kf.text,W/2,HUD+20+i*16);
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    });

    // Countdown
    if(!this.gameReady){
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,HUD,W,AH);
      const cv=this.countdownVal;
      const isNightCd=this.roundNum%NIGHT_ROUND_MOD===NIGHT_ROUND_MOD-1;
      if(isNightCd){
        ctx.font='11px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle='#4466cc';ctx.shadowColor='#2244aa';ctx.shadowBlur=16;
        ctx.fillText('☾  NIGHT MODE  ☾',W/2,arenaMidY-68);
        ctx.font='8px "Press Start 2P"';ctx.fillStyle='#334488';ctx.shadowBlur=0;
        ctx.fillText('USE YOUR RADAR — STAY SHARP',W/2,arenaMidY-44);
      }
      ctx.font='80px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      const goColor=cv===1?PAL.red:cv===2?PAL.yellow:cv===0?PAL.green:PAL.white;
      ctx.fillStyle=goColor;
      ctx.shadowColor=goColor;ctx.shadowBlur=40;
      ctx.fillText(cv>0?cv:'GO!',W/2,arenaMidY);ctx.shadowBlur=0;
    }

    // Round end banner
    if(this.matchOver){
      const wt=Math.min(1,(this.winTimer)/500);
      ctx.globalAlpha=wt*.75;
      ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,HUD,W,AH);
      ctx.globalAlpha=wt;
      if(this.winner){
        const wdef=TANK_DEF[this.winner.type];
        ctx.font='18px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillStyle=wdef.col;ctx.shadowColor=wdef.col;ctx.shadowBlur=20;
        ctx.fillText('P'+(this.winner.playerNum)+' TAKES THE ROUND!',W/2,arenaMidY-20);
        ctx.shadowBlur=0;
        ctx.font='18px "Press Start 2P"';ctx.fillStyle=PAL.white;
        ctx.fillText('MATCH SCORE '+(this.winner.playerNum===1?this.tanks[0].kills+1:this.tanks[0].kills)+' - '+(this.winner.playerNum===2?this.tanks[1].kills+1:this.tanks[1].kills),W/2,arenaMidY+18);
      }
      ctx.globalAlpha=1;
    }

    if(this.input.shouldShowTouchControls()){
      this.drawControlDock(ctx);
      this.drawTouchControls(ctx);
    }
  }

  drawPause(ctx){
    this.drawPlay(ctx);
    ctx.fillStyle='rgba(0,0,0,.66)';
    ctx.fillRect(0,0,W,H);
    const panel={x:W/2-170,y:H/2-150,w:340,h:240};
    ctx.fillStyle='rgba(8,10,24,.96)';
    ctx.fillRect(panel.x,panel.y,panel.w,panel.h);
    ctx.strokeStyle='rgba(0,255,136,.24)';
    ctx.lineWidth=2;
    ctx.strokeRect(panel.x,panel.y,panel.w,panel.h);
    this.glow(ctx,PAL.yellow,10);
    this.txt(ctx,'PAUSED',W/2,panel.y+38,13,PAL.yellow);
    ctx.shadowBlur=0;
    ctx.font='8px "Press Start 2P"';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=PAL.dim;
    ctx.fillText(this.pauseReason||'GAME PAUSED',W/2,panel.y+66);
    const opts=this.getPauseOptions();
    opts.forEach((opt,i)=>{
      const rect=this.getPauseHitboxes(opts)[i].rect;
      const sel=i===this.pauseSel;
      if(sel){
        ctx.fillStyle='rgba(0,255,136,.08)';
        ctx.fillRect(rect.x,rect.y,rect.w,rect.h);
        ctx.strokeStyle='rgba(0,255,136,.24)';
        ctx.strokeRect(rect.x,rect.y,rect.w,rect.h);
      }
      ctx.font='18px "Press Start 2P"';
      ctx.fillStyle=sel?PAL.green:PAL.white;
      ctx.fillText(opt,rect.x+rect.w/2,rect.y+rect.h/2+1);
    });
    ctx.font='8px "Press Start 2P"';
    ctx.fillStyle=PAL.dim;
    ctx.fillText(this.input.shouldShowTouchControls()?'TAP OPTION TO CONFIRM':'ESC RESUME   ENTER SELECT',W/2,panel.y+panel.h-26);
  }

  drawAttract(ctx){
    const t=this.now;
    const pt=this.attractTime; // time within current phase
    const ph=this.attractPhase;

    // ── Shared background ─────────────────────────────────────────────
    ctx.fillStyle='#07070e';ctx.fillRect(0,0,W,H);

    // Subtle diagonal grid
    const s=(t*.012)%40;
    ctx.strokeStyle='rgba(18,18,42,0.7)';ctx.lineWidth=0.7;
    for(let x2=-s;x2<W+H;x2+=40){ctx.beginPath();ctx.moveTo(x2,0);ctx.lineTo(x2-H*0.5,H);ctx.stroke();}

    // ── Phase 0: TITLE ────────────────────────────────────────────────
    if(ph===0){
      // Main title
      const tg=ctx.createLinearGradient(W/2-160,0,W/2+160,0);
      tg.addColorStop(0,'#cc7700');tg.addColorStop(0.5,'#ffee88');tg.addColorStop(1,'#cc7700');
      ctx.font='28px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='#ffaa00';ctx.shadowBlur=20+6*Math.sin(t*0.002);
      ctx.fillStyle=tg;ctx.fillText('TANK',W/2,220);
      ctx.font='28px "Press Start 2P"';ctx.fillText('TACTICS',W/2,262);
      ctx.font='16px "Press Start 2P"';ctx.fillStyle='#666688';ctx.shadowBlur=0;
      ctx.fillText('RETRO RELOAD',W/2,302);

      // 4 tank icons orbiting the title in a wide oval
      if(!this._attractTanks){
        this._attractTanks=TANK_ORDER.map((type,i)=>{
          const tk=new Tank(type,0,0,0,null,i+1);
          tk.attractOff=i/4;
          return tk;
        });
      }
      const cx=W/2,cy=340,rx=200,ry=55;
      this._attractTanks.forEach(tk=>{
        const p=(this.attractTankP+tk.attractOff)%1;
        const θ=p*Math.PI*2;
        tk.x=cx+rx*Math.cos(θ);
        tk.y=cy+ry*Math.sin(θ);
        const vx=-rx*Math.sin(θ),vy=ry*Math.cos(θ);
        tk.angle=Math.atan2(vx,-vy);
        tk.alive=true;
        // Depth scale: tanks behind title appear smaller
        const depth=0.75+0.25*Math.sin(θ+Math.PI/2);
        ctx.save();ctx.translate(tk.x,tk.y);ctx.scale(depth,depth);ctx.translate(-tk.x,-tk.y);
        tk.draw(ctx,t);
        ctx.restore();
      });

      // "PRESS ANY KEY" blink
      const blink=Math.sin(t*0.004)>0;
      ctx.font='10px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=blink?PAL.green:'#1a1a35';
      ctx.shadowColor=PAL.green;ctx.shadowBlur=blink?12:0;
      ctx.fillText('PRESS ANY KEY TO PLAY',W/2,H-80);
      ctx.shadowBlur=0;

      // Version/credit line
      ctx.font='7px "Press Start 2P"';ctx.fillStyle='#2a2a44';
      ctx.fillText('© RETRO RELOAD  •  ALL RIGHTS RESERVED',W/2,H-52);
    }

    // ── Phase 1: TANK CHASE ───────────────────────────────────────────
    else if(ph===1){
      // Header
      ctx.font='12px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#333355';ctx.fillText('TANK TACTICS  •  RETRO RELOAD',W/2,38);

      // Arena outline (just a rect to suggest the battlefield)
      ctx.strokeStyle='#1a1a35';ctx.lineWidth=2;
      ctx.strokeRect(40,80,W-80,760);

      // Oval chase track (faint guide)
      const cx=W/2,cy=460,rx=200,ry=130;
      ctx.strokeStyle='rgba(26,26,52,0.6)';ctx.lineWidth=1;
      ctx.setLineDash([4,8]);
      ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);

      // Init tanks once
      if(!this._attractTanks){
        this._attractTanks=TANK_ORDER.map((type,i)=>{
          const tk=new Tank(type,0,0,0,null,i+1);
          tk.attractOff=i/4;
          return tk;
        });
      }

      // Position and draw tanks chasing in oval loop
      // Lead tank (RED, offset 0) is being chased by the others
      const tanks=this._attractTanks;
      tanks.forEach(tk=>{
        const p=(this.attractTankP+tk.attractOff)%1;
        const θ=p*Math.PI*2;
        tk.x=cx+rx*Math.cos(θ);
        tk.y=cy+ry*Math.sin(θ);
        const vx=-rx*Math.sin(θ),vy=ry*Math.cos(θ);
        tk.angle=Math.atan2(vx,-vy);
        tk.alive=true;
      });

      // Draw track exhaust trails
      tanks.forEach(tk=>{
        const def=TANK_DEF[tk.type];
        ctx.fillStyle=def.col+'22';
        for(let i=1;i<=5;i++){
          const tp=(this.attractTankP+tk.attractOff-i*0.008+1)%1;
          const θt=tp*Math.PI*2;
          const tx2=cx+rx*Math.cos(θt), ty2=cy+ry*Math.sin(θt);
          ctx.globalAlpha=(6-i)/6*0.35;
          ctx.beginPath();ctx.arc(tx2,ty2,5-i*0.6,0,Math.PI*2);ctx.fill();
        }
        ctx.globalAlpha=1;
      });

      // Draw tanks (front ones on top — sort by y)
      [...tanks].sort((a,b)=>a.y-b.y).forEach(tk=>tk.draw(ctx,t));

      // Occasional "!" exclamation above chase leader (RED tank)
      const lead=tanks[0];
      const excTime=(pt%2000)/2000;
      if(excTime<0.3){
        const excAlpha=excTime<0.15?excTime/0.15:1-(excTime-0.15)/0.15;
        ctx.globalAlpha=excAlpha;
        ctx.font='14px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillStyle=TANK_DEF.RED.col;ctx.shadowColor=TANK_DEF.RED.col;ctx.shadowBlur=10;
        ctx.fillText('!',lead.x,lead.y-28);
        ctx.shadowBlur=0;ctx.globalAlpha=1;
      }

      // Tank name labels that pop in/cycle
      const labelIdx=Math.floor(pt/2200)%4;
      const labelTk=tanks[labelIdx];
      const labelDef=TANK_DEF[labelTk.type];
      const lblAlpha=Math.min(1,Math.min(pt%2200,2200-(pt%2200))/300);
      ctx.globalAlpha=lblAlpha*0.9;
      ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillStyle=labelDef.col;ctx.shadowColor=labelDef.col;ctx.shadowBlur=8;
      ctx.fillText(labelDef.name,labelTk.x,labelTk.y-34);
      ctx.shadowBlur=0;ctx.globalAlpha=1;

      // "PRESS ANY KEY" blink at bottom
      const blink2=Math.sin(t*0.004)>0;
      ctx.font='10px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=blink2?PAL.white:'#1a1a35';
      ctx.shadowColor=PAL.white;ctx.shadowBlur=blink2?8:0;
      ctx.fillText('PRESS ANY KEY TO PLAY',W/2,H-60);
      ctx.shadowBlur=0;
    }

    // ── Phase 2: POWER-UP SHOWCASE ────────────────────────────────────
    else if(ph===2){
      const puKeys=Object.keys(PU_DEF);
      const PU_DESCS={
        RAPID:'Hold fire to shoot continuously\nat rapid pace',
        TRIPLE:'Each shot fires 3 bullets\nin a spread pattern',
        SHIELD:'Absorbs one hit\ncompletely — then gone',
        BOUNCE:'Bullets ricochet off walls\nup to 6 extra times',
        BREACH:'Bullets blast through\nand destroy wall segments',
        GHOST:'Tank phases through walls\nand obstacles',
        SHRAPNEL:'Bullets explode on wall impact\nshards pass through barriers',
        HSPEED:'2x speed boost — gauge\nonly drains while moving',
        RADAR:'Night Mode only: 3 expanding\npulse rings reveal map & enemies',
        MINE:'Hold fire 3s to place a mine\nbehind tank. Kills anyone.',
      };

      // Header
      ctx.font='12px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#333355';ctx.fillText('TANK TACTICS  •  RETRO RELOAD',W/2,38);

      // Title
      const tg2=ctx.createLinearGradient(W/2-120,0,W/2+120,0);
      tg2.addColorStop(0,'#cc7700');tg2.addColorStop(0.5,'#ffee88');tg2.addColorStop(1,'#cc7700');
      ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor='#ffaa00';ctx.shadowBlur=10;
      ctx.fillStyle=tg2;ctx.fillText('POWER-UP ARSENAL',W/2,90);
      ctx.shadowBlur=0;

      // Thin separator
      ctx.strokeStyle='#1a1a35';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(40,108);ctx.lineTo(W-40,108);ctx.stroke();

      // Cycle through power-ups — show 3 at a time, scroll every 2.3s
      const timePerGroup=2300;
      const groupIdx=Math.floor(pt/timePerGroup)%Math.ceil(puKeys.length/3);
      const groupT=(pt%timePerGroup)/timePerGroup; // 0-1 within group
      const slideIn=Math.min(1,groupT*6); // fast slide in
      const slideOut=groupT>0.85?(groupT-0.85)/0.15:0; // slide out near end

      for(let gi=0;gi<3;gi++){
        const puIdx=(groupIdx*3+gi)%puKeys.length;
        const key=puKeys[puIdx];
        const def=PU_DEF[key];
        const isNight=key==='RADAR';

        const cardY=124+gi*290; // base position for 3 cards
        const cardH=270;
        const cardX=40;
        const cardW=W-80;

        // Slide animation
        const offX=(1-slideIn+slideOut)*W*1.1;
        const dir=gi%2===0?1:-1; // alternate slide directions
        ctx.save();ctx.translate(offX*dir,0);

        // Card bg
        ctx.fillStyle=isNight?'rgba(10,10,30,0.92)':'rgba(10,10,24,0.88)';
        ctx.fillRect(cardX,cardY,cardW,cardH);
        ctx.strokeStyle=def.col+(isNight?'99':'66');ctx.lineWidth=isNight?2.5:2;
        ctx.strokeRect(cardX,cardY,cardW,cardH);

        // Large icon circle
        const icx=cardX+cardW/2;
        const icy=cardY+90;
        const pulse=1+0.08*Math.sin(t*0.004+gi);
        ctx.shadowColor=def.col;ctx.shadowBlur=20*pulse;
        ctx.fillStyle=def.col+'44';
        ctx.beginPath();ctx.arc(icx,icy,52*pulse,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle=def.col;ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(icx,icy,52*pulse,0,Math.PI*2);ctx.stroke();
        ctx.fillStyle=def.col;
        ctx.font=`bold 22px "Press Start 2P"`;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(def.icon,icx,icy);
        ctx.shadowBlur=0;

        // Name
        ctx.font='12px "Press Start 2P"';ctx.fillStyle=def.col;ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.shadowColor=def.col;ctx.shadowBlur=6;
        ctx.fillText(def.label,icx,cardY+162);
        ctx.shadowBlur=0;

        // Description
        const lines=(PU_DESCS[key]||'').split('\n');
        ctx.font='8px "Press Start 2P"';ctx.fillStyle='#8888aa';
        lines.forEach((ln,li)=>ctx.fillText(ln,icx,cardY+186+li*18));

        // Duration badge
        const durTxt=key==='HSPEED'?'FUEL-BASED':key==='RADAR'?'☾ NIGHT ONLY':key==='MINE'?'3 MINES':def.dur===0?'PERMANENT':Math.round(def.dur/1000)+'s';
        ctx.font='7px "Press Start 2P"';ctx.fillStyle=isNight?'#334488':PAL.dim;
        ctx.fillText(durTxt,icx,cardY+cardH-10);

        ctx.restore();
      }

      // "PRESS ANY KEY" blink
      const blink3=Math.sin(t*0.004)>0;
      ctx.font='10px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=blink3?PAL.green:'#1a1a35';
      ctx.shadowColor=PAL.green;ctx.shadowBlur=blink3?12:0;
      ctx.fillText('PRESS ANY KEY TO PLAY',W/2,H-36);
      ctx.shadowBlur=0;
    }
  }

  drawPUBar(ctx,tank,x,y,right){
    const pus=[];
    if(tank.shield)     pus.push({def:PU_DEF.SHIELD,pct:1});
    if(tank.rapid)      pus.push({def:PU_DEF.RAPID, pct:tank.rapidTimer/PU_DEF.RAPID.dur});
    if(tank.triple)     pus.push({def:PU_DEF.TRIPLE,pct:tank.tripleTimer/PU_DEF.TRIPLE.dur});
    if(tank.bounceBonus)pus.push({def:PU_DEF.BOUNCE,pct:tank.bounceTimer/PU_DEF.BOUNCE.dur});
    if(tank.wallBreak)  pus.push({def:PU_DEF.BREACH,pct:tank.wallBreakTimer/PU_DEF.BREACH.dur});
    if(tank.ghost)      pus.push({def:PU_DEF.GHOST,     pct:tank.ghostTimer/PU_DEF.GHOST.dur});
    if(tank.shrapnel)   pus.push({def:PU_DEF.SHRAPNEL,  pct:tank.shrapnelTimer/PU_DEF.SHRAPNEL.dur});
    if(tank.hspeed)     pus.push({def:PU_DEF.HSPEED,    pct:tank.hspeedFuel/PU_DEF.HSPEED.dur,fuelBased:true});
    if(tank.radarPing||tank.radarPulses.length>0) pus.push({def:PU_DEF.RADAR,pct:tank.radarPulsesLeft/RADAR_PULSE_COUNT});
    if(tank.mineCount>0) pus.push({def:PU_DEF.MINE,pct:tank.mineCount/3,mineCount:tank.mineCount});
    if(!pus.length)return;
    const barW=82;
    pus.forEach((p,i)=>{
      const ly=y+i*13;
      if(ly>HUD-4)return;
      // Name label
      ctx.font='8px "Press Start 2P"';
      ctx.textAlign=right?'right':'left';
      ctx.textBaseline='middle';
      ctx.shadowColor=p.def.col;ctx.shadowBlur=8;
      ctx.fillStyle=p.def.col;
      ctx.fillText(p.def.label,x,ly);
      ctx.shadowBlur=0;
      // Duration bar (skip for permanent like SHIELD)
      if(p.mineCount!=null){
        // Mine count: show dots for remaining mines
        const bx=right?x-barW:x;
        for(let mi=0;mi<3;mi++){
          ctx.fillStyle=mi<p.mineCount?p.def.col:'rgba(0,0,0,.4)';
          ctx.beginPath();ctx.arc(bx+6+mi*14,ly+6,4,0,Math.PI*2);ctx.fill();
        }
      }else if(p.def.dur>0){
        const bx=right?x-barW:x;
        ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(bx,ly+5,barW,2);
        ctx.fillStyle=p.def.col;ctx.fillRect(bx,ly+5,barW*p.pct,2);
      }
    });
  }

  drawNightFog(ctx){
    // ── Which tanks act as the "observer" for this screen? ──────
    // Online: only the local player's tank reveals terrain.
    // Single player: only P1 reveals terrain.
    // Local 2-player (shared screen): both tanks reveal terrain.
    const isLocal2P=!this.isOnlineMode()&&!this.singlePlayer;
    const observerNums=this.isOnlineHost()?[1]:this.isOnlineGuest()?[2]:[1];
    const observers=isLocal2P?this.tanks:this.tanks.filter(t=>observerNums.includes(t.playerNum));

    // ── Build fog canvas ─────────────────────────────────────────
    if(!this._fogCanvas||this._fogCanvas.width!==W){
      this._fogCanvas=document.createElement('canvas');
      this._fogCanvas.width=W;this._fogCanvas.height=H;
    }
    const fc=this._fogCanvas.getContext('2d');
    fc.clearRect(0,HUD,W,AH);
    fc.globalCompositeOperation='source-over';
    fc.fillStyle='rgba(0,0,10,0.96)';
    fc.fillRect(0,HUD,W,AH);
    fc.globalCompositeOperation='destination-out';

    // Terrain holes: only for observer tanks' personal radar
    observers.forEach(t=>{
      if(!t.alive)return;
      const g=fc.createRadialGradient(t.x,t.y,RADAR_RADIUS*0.65,t.x,t.y,RADAR_RADIUS);
      g.addColorStop(0,'rgba(0,0,0,1)');
      g.addColorStop(1,'rgba(0,0,0,0)');
      fc.fillStyle=g;
      fc.beginPath();fc.arc(t.x,t.y,RADAR_RADIUS,0,Math.PI*2);fc.fill();
    });
    // Terrain holes: sweeping pulse rings (observer tanks only)
    observers.forEach(t=>{
      t.radarPulses.forEach(p=>{
        const fade=Math.max(0,1-p.r/RADAR_PULSE_MAX);
        const inner=Math.max(0,p.r-RADAR_PULSE_WIDTH);
        const outer=p.r+12;
        if(outer<=0)return;
        const g=fc.createRadialGradient(t.x,t.y,inner,t.x,t.y,outer);
        g.addColorStop(0,'rgba(0,0,0,0)');
        g.addColorStop(0.3,`rgba(0,0,0,${0.92*fade})`);
        g.addColorStop(0.75,`rgba(0,0,0,${0.92*fade})`);
        g.addColorStop(1,'rgba(0,0,0,0)');
        fc.fillStyle=g;
        fc.beginPath();fc.arc(t.x,t.y,outer,0,Math.PI*2);fc.fill();
      });
    });
    fc.globalCompositeOperation='source-over';
    ctx.drawImage(this._fogCanvas,0,0);

    // ── Hide enemy tank sprites not in radar range ───────────────
    // Helper: is tank T visible to observer O?
    const tankVisible=(t,o)=>{
      if(t===o)return true; // own tank always visible
      const dist=Math.hypot(t.x-o.x,t.y-o.y);
      if(dist<RADAR_RADIUS)return true;
      // Check if pulse ring is sweeping over t right now
      return o.radarPulses.some(p=>{
        const inner=Math.max(0,p.r-RADAR_PULSE_WIDTH-12);
        const outer=p.r+12;
        return dist>=inner&&dist<=outer;
      });
    };
    this.tanks.forEach(t=>{
      if(!t.alive)return;
      const visible=observers.some(o=>o.alive&&tankVisible(t,o));
      if(!visible){
        // Paint solid fog over this tank's sprite
        ctx.fillStyle='rgba(0,0,10,0.97)';
        ctx.beginPath();ctx.arc(t.x,t.y,30,0,Math.PI*2);ctx.fill();
      }
    });

    // ── Always-visible arena perimeter ───────────────────────────
    ctx.strokeStyle='rgba(80,110,200,0.7)';ctx.lineWidth=3;
    ctx.strokeRect(1,HUD+1,W-2,AH-2);

    // ── Radar rim dashes on observer tanks ───────────────────────
    observers.forEach(t=>{
      if(!t.alive)return;
      ctx.strokeStyle=TANK_DEF[t.type].col+'44';ctx.lineWidth=1.5;
      ctx.setLineDash([4,7]);
      ctx.beginPath();ctx.arc(t.x,t.y,RADAR_RADIUS,0,Math.PI*2);ctx.stroke();
      ctx.setLineDash([]);
    });

    // ── Pulse glow rings ─────────────────────────────────────────
    observers.forEach(t=>{
      t.radarPulses.forEach(p=>{
        const fade=Math.max(0,1-p.r/RADAR_PULSE_MAX);
        if(fade<=0)return;
        ctx.strokeStyle=`rgba(0,255,136,${fade*0.85})`;
        ctx.lineWidth=2.5;
        ctx.shadowColor='#00ff88';ctx.shadowBlur=14*fade;
        ctx.beginPath();ctx.arc(t.x,t.y,p.r,0,Math.PI*2);ctx.stroke();
        ctx.shadowBlur=0;
      });
    });

    // ── Night atmosphere: faint star dots ────────────────────────
    const starSeed=this.roundNum*999;
    ctx.fillStyle='rgba(180,200,255,0.18)';
    for(let i=0;i<28;i++){
      const sx=((starSeed*i*137+i*79)%W+W)%W;
      const sy=HUD+((starSeed*i*53+i*113)%AH+AH)%AH;
      ctx.beginPath();ctx.arc(sx,sy,0.8,0,Math.PI*2);ctx.fill();
    }
  }

  drawEnd(ctx){
    const t=this.endTimer;
    ctx.fillStyle=PAL.bg;ctx.fillRect(0,0,W,H);
    this.ps.draw(ctx);

    const w=this.winner;
    const loser=this.tanks.find(tk=>tk!==w);

    if(w){
      const wdef=TANK_DEF[w.type];
      const centerX=W/2, centerY=H*0.415; // ~431

      // ── Figure-8 victory lap ────────────────────────────────
      const ω=t*0.002;                   // one full figure-8 every ~3.1 s
      const Rx=100, Ry=50;
      const fx=centerX+Rx*Math.sin(ω);
      const fy=centerY+Ry*Math.sin(2*ω);
      // Angle follows path tangent so tank always faces direction of travel
      const vx=Rx*0.002*Math.cos(ω);
      const vy=Ry*2*0.002*Math.cos(2*ω);
      const wAngle=Math.atan2(vx,-vy);

      // Pulsing glow halo under winner
      ctx.save();
      ctx.translate(fx,fy);
      const haloPulse=0.55+0.45*Math.sin(t*0.005);
      const halo=ctx.createRadialGradient(0,0,8,0,0,56);
      halo.addColorStop(0,wdef.col+'55');
      halo.addColorStop(1,'transparent');
      ctx.globalAlpha=haloPulse;
      ctx.fillStyle=halo;
      ctx.beginPath();ctx.arc(0,0,56,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
      ctx.restore();

      // Winner tank – scaled up, angle follows figure-8 tangent
      ctx.save();
      ctx.globalAlpha=Math.min(1,t/350);
      ctx.translate(fx,fy);
      ctx.rotate(wAngle);
      ctx.scale(1.35,1.35);
      this.drawFullTank(ctx,w.type,t);
      ctx.globalAlpha=1;
      ctx.restore();

      // ── Loser – crashed to the side, smoking ────────────────
      if(loser){
        const lx=W/2+192, ly=centerY+108;

        // Rising smoke column (manually animated with arcs)
        for(let i=0;i<8;i++){
          const age=((t*0.6+i*310)%2400)/2400;
          const sx=lx+(i%2===0?-4:4)+Math.sin(age*Math.PI*3+i)*8;
          const sy=ly-12-age*88;
          const sr=4+age*16;
          ctx.globalAlpha=(1-age)*(0.45+0.2*Math.sin(t*0.003+i));
          ctx.fillStyle=age<0.45?'#4a4a66':'#252535';
          ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fill();
        }
        // Occasional ember spark
        for(let i=0;i<3;i++){
          const age=((t*1.4+i*500)%900)/900;
          if(age>0.6)continue;
          ctx.globalAlpha=(0.6-age)*0.9;
          ctx.fillStyle=age<0.3?'#ff8800':'#ff4400';
          const ex=lx+(-6+i*6)+Math.sin(age*8+i)*4;
          const ey=ly-8-age*28;
          ctx.beginPath();ctx.arc(ex,ey,2,0,Math.PI*2);ctx.fill();
        }
        ctx.globalAlpha=1;

        // Loser tank body – tilted & faded (looking defeated)
        ctx.save();
        ctx.translate(lx,ly);
        ctx.rotate(Math.PI*0.58);   // fallen sideways
        ctx.globalAlpha=0.48;
        this.drawFullTank(ctx,loser.type,0);
        ctx.globalAlpha=1;
        ctx.restore();
      }

      // ── Victory banner ──────────────────────────────────────
      const slide=Math.min(1,t/550);
      ctx.save();ctx.translate(0,(1-slide)*-90);
      const wg=ctx.createLinearGradient(W/2-180,0,W/2+180,0);
      wg.addColorStop(0,wdef.col);wg.addColorStop(0.5,'#ffffff');wg.addColorStop(1,wdef.col);
      ctx.font='24px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.shadowColor=wdef.col;ctx.shadowBlur=28;
      ctx.fillStyle=wg;
      ctx.fillText('PLAYER '+w.playerNum+' WINS!',W/2,112);
      ctx.shadowBlur=0;
      ctx.font='9px "Press Start 2P"';ctx.fillStyle=wdef.col;ctx.globalAlpha=0.75;
      ctx.fillText(wdef.name.toUpperCase()+' VICTORIOUS',W/2,148);
      ctx.globalAlpha=1;
      ctx.restore();

      // Stats
      ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle='#333355';
      ctx.textBaseline='middle';
      ctx.fillText('ROUND WINS: P1 '+this.tanks[0].kills+'  -  P2 '+this.tanks[1].kills,W/2,174);
    }

    // ── Menu options ────────────────────────────────────────
    const opts=this.getEndOptions();
    const startY=H*0.725;
    opts.forEach((o,i)=>{
      const sel=i===this.endSel;
      const y=startY+i*44;
      if(sel){
        ctx.fillStyle='rgba(0,255,136,.06)';ctx.fillRect(W/2-130,y-15,260,30);
        ctx.strokeStyle='rgba(0,255,136,.25)';ctx.lineWidth=1;
        ctx.strokeRect(W/2-130,y-15,260,30);
        ctx.font='16px "Press Start 2P"';ctx.fillStyle=PAL.green;ctx.textAlign='left';
        this.glow(ctx,PAL.green,8);ctx.fillText('▶',W/2-120,y);
      }
      ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=sel?PAL.green:PAL.white;ctx.shadowBlur=sel?6:0;
      ctx.fillText(o,W/2,y);ctx.shadowBlur=0;
    });
    ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.fillStyle=PAL.dim;
    ctx.textBaseline='middle';
    ctx.fillText(this.isOnlineGuest()?'HOST DECIDES REMATCH   ESC LEAVE':'↑↓ SELECT   ENTER CONFIRM',W/2,H-28);
  }

  drawFullTank(ctx,type,t){
    const d=TANK_DEF[type];
    const mov=Math.sin(t*.005)*1.5;
    ctx.fillStyle='#111';ctx.fillRect(-17,-14,7,28);ctx.fillRect(10,-14,7,28);
    for(let i=0;i<7;i++){
      const oy=((mov+i*4)%28)-14;
      ctx.fillStyle='#2a2a2a';ctx.fillRect(-17,oy,7,2.5);ctx.fillRect(10,oy,7,2.5);
    }
    ctx.fillStyle=d.dark;ctx.fillRect(-10,-13,20,26);
    ctx.fillStyle=d.col; ctx.fillRect(-9,-12,18,24);
    ctx.fillStyle=d.dark;ctx.fillRect(-9,-2,18,4);
    ctx.fillStyle=d.dark;ctx.fillRect(-6,-6,12,12);
    ctx.fillStyle=d.col; ctx.fillRect(-5,-5,10,10);
    ctx.fillStyle=d.dark;ctx.fillRect(-3.5,-20,7,20);
    ctx.fillStyle='#555'; ctx.fillRect(-2.5,-20,5,19);
    ctx.fillStyle=d.dark;ctx.fillRect(-4.5,-22,9,4);
  }

  getTouchLayout(){

    return pt&&rect&&pt.x>=rect.x&&pt.x<=rect.x+rect.w&&pt.y>=rect.y&&pt.y<=rect.y+rect.h;
