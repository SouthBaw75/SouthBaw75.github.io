function thinMazeSourceMap(src){
  const out=src.map(row=>[...row]);
  for(let r=1;r<src.length-1;r++){
    for(let c=1;c<src[0].length-1;c++){
      if(out[r][c]!==1)continue;
      if((r+c)%3!==0)continue;
      out[r][c]=0;
    }
  }
  return out;
}

function rotateMapPortrait(src){
  const srcRows=src.length;
  const srcCols=src[0].length;
  const out=Array.from({length:srcCols},()=>Array(srcRows).fill(1));
  for(let r=0;r<srcRows;r++){
    for(let c=0;c<srcCols;c++){
      out[c][srcRows-1-r]=src[r][c];
    }
  }
  return out;
}

/* ══════════════════════════════════════════════════

function genMap(){
  const g=Array.from({length:ROWS},()=>Array(COLS).fill(1));
  const vis=Array.from({length:ROWS},()=>Array(COLS).fill(false));
  const openRect=(row,col,h,w)=>{
    for(let r=row;r<row+h;r++){
      for(let c=col;c<col+w;c++){
        if(r>0&&r<ROWS-1&&c>0&&c<COLS-1)g[r][c]=0;
      }
    }
  };
  function carve(r,c){
    vis[r][c]=true;g[r][c]=0;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-.5);
    for(const[dr,dc]of dirs){
      const nr=r+dr,nc=c+dc;
      if(nr>0&&nr<ROWS-1&&nc>0&&nc<COLS-1&&!vis[nr][nc]){
        g[r+dr/2][c+dc/2]=0;carve(nr,nc);
      }
    }
  }
  carve(1,1);
  // Extra openings for breathing room
  for(let i=0;i<42;i++){
    const r=1+Math.floor(Math.random()*(ROWS-2));
    const c=1+Math.floor(Math.random()*(COLS-2));
    g[r][c]=0;
  }
  for(let i=0;i<6;i++){
    const roomH=2+Math.floor(Math.random()*2);
    const roomW=2+Math.floor(Math.random()*2);
    const r=1+Math.floor(Math.random()*(ROWS-roomH-1));
    const c=1+Math.floor(Math.random()*(COLS-roomW-1));
    openRect(r,c,roomH,roomW);
  }
  openRect(ROWS/2-1|0,2,2,COLS-4);
  openRect(3,COLS/2-1|0,ROWS-6,2);
  // Ensure spawn corners open
  [[1,1],[1,2],[2,1],[ROWS-2,1],[ROWS-2,2],[ROWS-3,1],
   [1,COLS-2],[1,COLS-3],[2,COLS-2],[ROWS-2,COLS-2],[ROWS-2,COLS-3],[ROWS-3,COLS-2]]
  .forEach(([r,c])=>g[r][c]=0);
  return g;
}

/* ══════════════════════════════════════════════════

class AudioManager{
  constructor(){
    this.ac=null;this.master=null;this.muted=false;
    this.masterLevel=0.38;
    this.theme=null;this.themeStarted=false;
    this.themeTitleVolume=.55;
    this.themeGameVolume=.24;
    this.themeMode='title';
  }
  init(){
    try{
      this.ac=new(window.AudioContext||window.webkitAudioContext)();
      this.master=this.ac.createGain();
      this.master.gain.value=this.masterLevel;
      this.master.connect(this.ac.destination);
    }catch(e){}
    this.theme=new Audio('assets/music/tank-tactics-theme.mp3');
    this.theme.loop=true;
    this.theme.preload='auto';
    this.theme.volume=this.themeTitleVolume;
    this.theme.muted=this.muted;
    this.theme.playsInline=true;
  }
  resume(){if(this.ac&&this.ac.state==='suspended')this.ac.resume();}
  setMuted(muted){
    this.muted=muted;
    if(this.master)this.master.gain.value=muted?0:this.masterLevel;
    if(this.theme)this.theme.muted=muted;
  }
  setThemeMode(mode){
    this.themeMode=mode==='game'?'game':'title';
    if(this.theme)this.theme.volume=this.themeMode==='game'?this.themeGameVolume:this.themeTitleVolume;
  }
  startTheme(){
    if(!this.theme)return Promise.resolve(false);
    this.theme.muted=this.muted;
    this.setThemeMode(this.themeMode);
    if(this.themeStarted&&!this.theme.paused)return Promise.resolve(true);
    const playPromise=this.theme.play();
    if(playPromise&&playPromise.catch){
      return playPromise.then(()=>{this.themeStarted=true;return true;}).catch(()=>false);
    }
    this.themeStarted=true;
    return Promise.resolve(true);
  }
  _gain(vol,t){
    const g=this.ac.createGain();
    g.gain.setValueAtTime(0,t);
    return g;
  }
  tone(freq,type,vol,attack,decay,pan=0){
    if(!this.ac||this.muted)return;
    this.resume();
    const t=this.ac.currentTime;
    const o=this.ac.createOscillator();
    const g=this.ac.createGain();
    const p=this.ac.createStereoPanner();
    o.type=type;o.frequency.value=freq;p.pan.value=pan;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+attack);
    g.gain.exponentialRampToValueAtTime(0.001,t+attack+decay);
    o.connect(g);g.connect(p);p.connect(this.master);
    o.start(t);o.stop(t+attack+decay+.05);
  }
  noise(dur,vol,freq,pan=0){
    if(!this.ac||this.muted)return;
    this.resume();
    const n=this.ac.sampleRate*dur;
    const buf=this.ac.createBuffer(1,n,this.ac.sampleRate);
    const d=buf.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=this.ac.createBufferSource();src.buffer=buf;
    const flt=this.ac.createBiquadFilter();flt.type='bandpass';flt.frequency.value=freq;flt.Q.value=3;
    const g=this.ac.createGain();const p=this.ac.createStereoPanner();
    const t=this.ac.currentTime;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    p.pan.value=pan;
    src.connect(flt);flt.connect(g);g.connect(p);p.connect(this.master);
    src.start(t);
  }
  shoot(pan=0){
    this.tone(200,'square',.35,.002,.13,pan);
    this.noise(.09,.25,900,pan);
  }
  ricochet(pan=0){
    const f=500+Math.random()*600;
    this.tone(f,'sine',.25,.001,.18,pan);
    this.tone(f*1.6,'sine',.12,.001,.1,pan);
  }
  explode(pan=0){
    this.noise(.5,.9,120,pan);
    this.noise(.25,.4,60,pan);
    this.tone(70,'sawtooth',.35,.002,.3,pan);
  }
  powerup(){[380,560,760,1100].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',.28,.01,.09),i*65));}
  hit(){this.tone(280,'square',.45,.001,.09);}
  menuMove(){this.tone(420,'square',.18,.001,.045);}
  menuSelect(){this.tone(840,'square',.25,.001,.08);setTimeout(()=>this.tone(1260,'square',.25,.001,.08),110);}
  countBeep(hi){this.tone(hi?1200:600,'square',.35,.001,.1);}
  victoryFanfare(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.tone(f,'square',.3,.01,.25),i*150));
  }
}

/* ══════════════════════════════════════════════════

class InputManager{
  constructor(){
    this.wrap=document.getElementById('wrap');
    this.down=new Set();this.pressed=new Set();this.pointerPressed=false;
    this.touchCapable='ontouchstart'in window||navigator.maxTouchPoints>0||window.matchMedia('(pointer: coarse)').matches;
    this.touchLayoutFn=null;
    this.touchPlayerNum=1;
    this.joystick={active:false,pointerId:null,x:0,y:0,magnitude:0};
    this.fire={active:false,pointerId:null};
    this.tapPoint=null;
    this.lastUITapAt=0;
    window.addEventListener('keydown',e=>{
      if(!this.down.has(e.code))this.pressed.add(e.code);
      this.down.add(e.code);
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    });
    window.addEventListener('keyup',e=>this.down.delete(e.code));
    window.addEventListener('pointerdown',()=>{this.pointerPressed=true;});
    window.addEventListener('pointerdown',e=>this.handlePointerDown(e),{passive:false});
    window.addEventListener('pointermove',e=>this.handlePointerMove(e),{passive:false});
    window.addEventListener('pointerup',e=>this.handlePointerUp(e),{passive:false});
    window.addEventListener('pointercancel',e=>this.handlePointerUp(e),{passive:false});
    this.wrap.addEventListener('click',e=>this.handleClick(e),{passive:false});
    this.wrap.addEventListener('touchstart',e=>this.handleTouchStart(e),{passive:false});
    this.wrap.addEventListener('touchmove',e=>this.handleTouchMove(e),{passive:false});
    this.wrap.addEventListener('touchend',e=>this.handleTouchEnd(e),{passive:false});
    this.wrap.addEventListener('touchcancel',e=>this.handleTouchEnd(e),{passive:false});
  }
  setTouchLayout(fn){this.touchLayoutFn=fn;}
  setTouchPlayerNum(playerNum){this.touchPlayerNum=playerNum||1;}
  getTouchLayout(){return this.touchLayoutFn?this.touchLayoutFn():null;}
  screenToGame(e){
    if(!this.wrap)return null;
    const rect=this.wrap.getBoundingClientRect();
    if(!rect.width||!rect.height)return null;
    return{
      x:(e.clientX-rect.left)*(W/rect.width),
      y:(e.clientY-rect.top)*(H/rect.height),
    };
  }
  inCircle(pt,circle){
    if(!pt||!circle)return false;
    const dx=pt.x-circle.x,dy=pt.y-circle.y;
    return dx*dx+dy*dy<=circle.r*circle.r;
  }
  updateJoystickFromPoint(pt,layout){
    const dx=pt.x-layout.joystick.x;
    const dy=pt.y-layout.joystick.y;
    const dist=Math.hypot(dx,dy);
    const max=layout.joystick.r;
    const clamped=dist>max?max/dist:1;
    this.joystick.x=dx*clamped/max;
    this.joystick.y=dy*clamped/max;
    this.joystick.magnitude=Math.min(1,dist/max);
  }
  handlePointerDown(e){
    const pt=this.screenToGame(e);
    if(!pt)return;
    const layout=this.getTouchLayout();
    if(this.touchCapable&&e.pointerType!=='mouse'&&layout){
      if(!this.joystick.active&&this.inCircle(pt,layout.joystick)){
        this.joystick.active=true;
        this.joystick.pointerId=e.pointerId;
        this.updateJoystickFromPoint(pt,layout);
        e.preventDefault();
        return;
      }
      if(!this.fire.active&&this.inCircle(pt,layout.fire)){
        this.fire.active=true;
        this.fire.pointerId=e.pointerId;
        this.pressed.add('TouchFire');
        e.preventDefault();
        return;
      }
    }
    this.tapPoint=pt;
    this.lastUITapAt=performance.now();
    if(e.pointerType!=='mouse'){
      e.preventDefault();
    }
  }
  handlePointerMove(e){
    const pt=this.screenToGame(e);
    if(e.pointerId!==this.joystick.pointerId)return;
    const layout=this.getTouchLayout();
    if(!layout||!pt)return;
    this.updateJoystickFromPoint(pt,layout);
    e.preventDefault();
  }
  handlePointerUp(e){
    if(e.pointerId===this.joystick.pointerId){
      this.joystick.active=false;
      this.joystick.pointerId=null;
      this.joystick.x=0;this.joystick.y=0;this.joystick.magnitude=0;
    }
    if(e.pointerId===this.fire.pointerId){
      this.fire.active=false;
      this.fire.pointerId=null;
    }
  }
  handleClick(e){
    if(this.getTouchLayout())return;
    if(performance.now()-this.lastUITapAt<350)return;
    const pt=this.screenToGame(e);
    if(!pt)return;
    this.pointerPressed=true;
    this.tapPoint=pt;
    e.preventDefault();
  }
  touchToPointer(touch,e){
    return{
      clientX:touch.clientX,
      clientY:touch.clientY,
      pointerId:touch.identifier,
      pointerType:'touch',
      preventDefault:()=>e.preventDefault(),
    };
  }
  handleTouchStart(e){
    this.pointerPressed=true;
    for(const touch of e.changedTouches){
      this.handlePointerDown(this.touchToPointer(touch,e));
    }
  }
  handleTouchMove(e){
    for(const touch of e.changedTouches){
      this.handlePointerMove(this.touchToPointer(touch,e));
    }
  }
  handleTouchEnd(e){
    for(const touch of e.changedTouches){
      this.handlePointerUp(this.touchToPointer(touch,e));
    }
  }
  consumeTap(){
    const tap=this.tapPoint;
    this.tapPoint=null;
    return tap;
  }
  isDown(k){return this.down.has(k)||((k==='TouchFire')&&this.fire.active);}
  wasPressed(k){return this.pressed.has(k);}
  anyPressed(){return this.pressed.size>0||this.pointerPressed;}
  clearPressed(){this.pressed.clear();this.pointerPressed=false;}
  getTouchVector(playerNum){
    if(playerNum!==this.touchPlayerNum||!this.touchCapable||!this.joystick.active||this.joystick.magnitude<0.08)return null;
    return{x:this.joystick.x,y:this.joystick.y,magnitude:this.joystick.magnitude};
  }
  isTouchPlayer(playerNum){return playerNum===this.touchPlayerNum;}
  shouldShowTouchControls(){return this.touchCapable;}
}

/* ══════════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════════ */
class Particle{
  constructor(x,y,vx,vy,col,life,sz){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.col=col;this.life=life;this.maxLife=life;this.sz=sz;
  }
  update(){this.x+=this.vx;this.y+=this.vy;this.vx*=.93;this.vy*=.93;this.life--;}
  draw(ctx){
    ctx.globalAlpha=Math.max(0,this.life/this.maxLife);
    ctx.fillStyle=this.col;
    ctx.fillRect(this.x-this.sz/2,this.y-this.sz/2,this.sz,this.sz);
    ctx.globalAlpha=1;
  }
}
class ParticleSystem{
  constructor(){this.p=[];}
  emit(x,y,col,n=12,spd=4,sz=4,life=30){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2;
      const s=spd*(.4+Math.random()*.9);
      this.p.push(new Particle(x+(Math.random()-.5)*8,y+(Math.random()-.5)*8,
        Math.cos(a)*s,Math.sin(a)*s,col,life+Math.random()*15|0,sz*(.4+Math.random()*.8)));
    }
  }
  update(){this.p=this.p.filter(p=>{p.update();return p.life>0;});}
  draw(ctx){this.p.forEach(p=>p.draw(ctx));}
}

/* ══════════════════════════════════════════════════
   BULLET
══════════════════════════════════════════════════ */
class Bullet{
  constructor(x,y,angle,owner,maxBounces,col,wallBreak=false,hasShrapnel=false){
    this.x=x;this.y=y;
    this.vx=Math.sin(angle)*BULLET_SPD;
    this.vy=-Math.cos(angle)*BULLET_SPD;
    this.owner=owner;this.maxBounces=maxBounces;
    this.bounces=0;this.active=true;
    this.col=col;
    this.wallBreak=wallBreak;
    this.hasShrapnel=hasShrapnel;
    this.trail=[];this.age=0;
    this.ricPos=null;// last ricochet position for spark
  }
  update(arena,tanks,ps,audio,ricochetOn=true,friendlyFire=false,onlineEvents=null,newBullets=null){
    if(!this.active)return;
    this.age++;
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>10)this.trail.shift();

    // Bullet sway — owner's turn input gently curves the bullet
    if(this.owner.turnInput!==0){
      const sway=this.owner.turnInput*0.03;
      const c=Math.cos(sway),s=Math.sin(sway);
      const nvx=this.vx*c-this.vy*s;
      const nvy=this.vx*s+this.vy*c;
      this.vx=nvx;this.vy=nvy;
    }

    // sub-step movement for accuracy
    const steps=3;
    for(let s=0;s<steps;s++){
      const svx=this.vx/steps,svy=this.vy/steps;
      const nx=this.x+svx,ny=this.y+svy;
      const r=3;
      const sx=Math.sign(svx),sy=Math.sign(svy);
      const hitX=arena.solid(nx+sx*r,this.y);
      const hitY=arena.solid(this.x,ny+sy*r);
      const hitC=arena.solid(nx+sx*r,ny+sy*r);
      if(this.wallBreak&&(hitX||hitY||hitC)){
        const hitPoints=[];
        if(hitX)hitPoints.push({x:nx+sx*r,y:this.y});
        if(hitY)hitPoints.push({x:this.x,y:ny+sy*r});
        if(hitC)hitPoints.push({x:nx+sx*r,y:ny+sy*r});
        const breached=arena.breakWallAt(hitPoints,this.owner.playerNum);
        if(breached){
          this.active=false;
          ps.emit(breached.x,breached.y,PU_DEF.BREACH.col,16,5,3,24);
          ps.emit(breached.x,breached.y,'#ffffff',8,6,2,18);
          audio.ricochet(((breached.x/W)*2-1)*.35);
          return;
        }
      }
      let ref=false;
      if(hitX||(hitC&&!hitY)){if(ricochetOn)this.vx=-this.vx;ref=true;}
      if(hitY||(hitC&&!hitX)){if(ricochetOn)this.vy=-this.vy;ref=true;}
      if(ref){
        if(this.hasShrapnel&&newBullets){
          this.active=false;
          ps.emit(this.x,this.y,PU_DEF.SHRAPNEL.col,14,6,2.5,20);
          ps.emit(this.x,this.y,'#ffffff',6,9,1.5,12);
          audio.ricochet((this.x/W*2-1)*.5);
          for(let si=0;si<10;si++){
            const sa=(si/10)*Math.PI*2+(Math.random()-.5)*.5;
            const spd=BULLET_SPD*(1.0+Math.random()*0.7);
            newBullets.push(new ShrapnelPiece(this.x,this.y,Math.cos(sa)*spd,Math.sin(sa)*spd,this.owner));
          }
          return;
        }
        if(!ricochetOn){this.active=false;return;}
        this.bounces++;
        this.ricPos={x:this.x,y:this.y};
        const pan=(this.x/W)*2-1;
        audio.ricochet(pan*.5);
        ps.emit(this.x,this.y,this.col,5,3,2,15);
        if(this.bounces>this.maxBounces){this.active=false;return;}
      }else{this.x=nx;this.y=ny;}
    }

    // Tank collision
    for(const tk of tanks){
      if(!tk.alive)continue;
      // Self-hit: blocked entirely when friendly fire is off, blocked before first bounce when on
      if(tk===this.owner&&(!friendlyFire||this.bounces===0))continue;
      const dx=this.x-tk.x,dy=this.y-tk.y;
      if(dx*dx+dy*dy<15*15){
        if(tk.spawnShieldTimer>0){
          // invulnerable during spawn grace period — bullet passes through
        }else if(tk.shield){
          tk.shield=false;this.active=false;
          ps.emit(this.x,this.y,'#ffffff',12,4,3,18);
          audio.hit();
          if(onlineEvents)onlineEvents.push({type:'shieldHit',x:this.x,y:this.y});
        }else if(!tk.ghost){
          this.active=false;
          if(tk!==this.owner)this.owner.roundKills++;
          else this.owner.roundKills=Math.max(0,this.owner.roundKills-1);// self-kill penalty
          if(onlineEvents)onlineEvents.push({type:'death',x:tk.x,y:tk.y,col:tk.col});
          tk.die(ps,audio);
        }
        return;
      }
    }
  }
  draw(ctx){
    if(!this.active)return;
    // Trail
    for(let i=0;i<this.trail.length;i++){
      const a=(i/this.trail.length)*.5;
      const sz=1+(i/this.trail.length)*3;
      ctx.globalAlpha=a;
      ctx.fillStyle=this.col;
      ctx.fillRect(this.trail[i].x-sz/2,this.trail[i].y-sz/2,sz,sz);
    }
    ctx.globalAlpha=1;
    // Glow
    ctx.shadowColor=this.col;ctx.shadowBlur=8;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(this.x,this.y,4.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x,this.y,3,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  }
}

/* ══════════════════════════════════════════════════
   SHRAPNEL PIECE — ghost mini-bullet from SHRAPNEL PU
══════════════════════════════════════════════════ */
class ShrapnelPiece{
  constructor(x,y,vx,vy,owner){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;
    this.owner=owner;this.active=true;
    this.life=26;this.maxLife=26;
    this.col=PU_DEF.SHRAPNEL.col;
    this.isShrapnel=true;
    this.trail=[];
  }
  update(arena,tanks,ps,audio,ricochetOn,friendlyFire=false,onlineEvents=null){
    if(!this.active)return;
    this.life--;
    if(this.life<=0){this.active=false;return;}
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>6)this.trail.shift();
    this.x+=this.vx;this.y+=this.vy;
    if(this.x<-20||this.x>W+20||this.y<-20||this.y>H+20){this.active=false;return;}
    for(const tk of tanks){
      if(!tk.alive)continue;
      if(tk===this.owner&&!friendlyFire)continue;
      const dx=this.x-tk.x,dy=this.y-tk.y;
      if(dx*dx+dy*dy<13*13){
        this.active=false;
        if(tk.spawnShieldTimer>0)return;
        if(tk.shield){
          tk.shield=false;
          ps.emit(this.x,this.y,'#ffffff',6,3,2,12);
          audio.hit();
          return;
        }
        if(!tk.ghost){
          if(tk!==this.owner)this.owner.roundKills++;
          else this.owner.roundKills=Math.max(0,this.owner.roundKills-1);
          if(onlineEvents)onlineEvents.push({type:'death',x:tk.x,y:tk.y,col:tk.col});
          tk.die(ps,audio);
        }
        return;
      }
    }
  }
  draw(ctx){
    if(!this.active)return;
    const a=this.life/this.maxLife;
    for(let i=0;i<this.trail.length;i++){
      ctx.globalAlpha=(i/this.trail.length)*a*0.55;
      ctx.fillStyle=this.col;
      ctx.fillRect(this.trail[i].x-1,this.trail[i].y-1,2,2);
    }
    ctx.globalAlpha=a;
    ctx.shadowColor=this.col;ctx.shadowBlur=5;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(this.x,this.y,2.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=this.col;
    ctx.beginPath();ctx.arc(this.x,this.y,1.5,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.shadowBlur=0;
  }
}

/* ══════════════════════════════════════════════════
   LAND MINE
══════════════════════════════════════════════════ */
class LandMine{
  constructor(x,y,ownerPlayerNum){
    this.x=x;this.y=y;this.ownerPlayerNum=ownerPlayerNum;
    this.active=true;
    this.armTimer=1200; // 1.2s arming delay so deployer can drive away
    this.t=0;
  }
  update(dt){
    this.t+=0.06;
    if(this.armTimer>0)this.armTimer-=dt;
  }
  get armed(){return this.armTimer<=0;}
  // Returns the playerNum of the tank that triggered this mine, or null
  checkTrigger(tanks){
    if(!this.active||!this.armed)return null;
    for(const t of tanks){
      if(!t.alive)continue;
      if(Math.hypot(t.x-this.x,t.y-this.y)<18)return t;
    }
    return null;
  }
  draw(ctx,isVisible){
    if(!this.active)return;
    ctx.save();
    ctx.translate(this.x,this.y);
    if(!isVisible){ctx.restore();return;}
    const pulse=0.7+0.3*Math.sin(this.t*2);
    // Outer warning ring (dim, only for owner)
    ctx.strokeStyle=`rgba(204,68,0,${0.25*pulse})`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke();
    // Mine body
    ctx.fillStyle=this.armed?'#cc4400':'#884422';
    ctx.shadowColor='#cc4400';ctx.shadowBlur=this.armed?8*pulse:3;
    ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
    // Prong spikes
    ctx.strokeStyle=this.armed?'#ff6622':'#664433';
    ctx.lineWidth=1.5;
    for(let i=0;i<6;i++){
      const a=(i/6)*Math.PI*2;
      ctx.beginPath();ctx.moveTo(Math.cos(a)*5,Math.sin(a)*5);ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10);ctx.stroke();
    }
    ctx.shadowBlur=0;
    ctx.restore();
  }
}

/* ══════════════════════════════════════════════════
   POWERUP
══════════════════════════════════════════════════ */
class PowerUp{
  constructor(x,y,type){
    this.x=x;this.y=y;this.type=type;this.active=true;this.t=0;
  }
  update(){this.t+=.07;}
  draw(ctx){
    if(!this.active)return;
    const def=PU_DEF[this.type];
    const sc=1+.08*Math.sin(this.t);
    const al=.75+.25*Math.sin(this.t);
    ctx.save();
    ctx.translate(this.x,this.y);ctx.scale(sc,sc);
    ctx.shadowColor=def.col;ctx.shadowBlur=16;
    // Outer ring
    ctx.globalAlpha=.3;
    ctx.fillStyle=def.col;
    ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.fill();
    // Border
    ctx.globalAlpha=al;
    ctx.strokeStyle=def.col;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(0,0,15,0,Math.PI*2);ctx.stroke();
    // Inner fill
    ctx.globalAlpha=.8;
    ctx.fillStyle=def.col;
    ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();
    // Icon
    ctx.globalAlpha=1;ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='bold 8px monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(def.icon,0,1);
    ctx.restore();
  }
  checkCollect(tank){
    if(!this.active)return false;
    const dx=this.x-tank.x,dy=this.y-tank.y;
    return dx*dx+dy*dy<20*20;
  }
}

/* ══════════════════════════════════════════════════
   TANK
══════════════════════════════════════════════════ */
class Tank{
  constructor(type,x,y,angle,controls,playerNum,isCPU=false){
    this.type=type;this.x=x;this.y=y;this.angle=angle;
    this.controls=controls;this.playerNum=playerNum;this.isCPU=isCPU;
    const d=TANK_DEF[type];
    this.speed=d.speed;this.rot=d.rot;this.fireMs=d.fireMs;this.baseBounces=d.bounces;
    this.alive=true;this.kills=0;this.roundKills=0;this.respawnTimer=0;this.lastFireTime=0;
    // Power-up state
    this.shield=false;this.ghost=false;this.ghostTimer=0;
    this.rapid=false;this.rapidTimer=0;
    this.triple=false;this.tripleTimer=0;
    this.bounceBonus=false;this.bounceTimer=0;
    this.wallBreak=false;this.wallBreakTimer=0;
    this.shrapnel=false;this.shrapnelTimer=0;
    this.hspeed=false;this.hspeedFuel=0;
    this.radarPing=false;this.radarPulses=[];this.radarNextPulse=0;this.radarPulsesLeft=0;
    this.mineCount=0;this.mineCharge=0;
    // Muzzle flash
    this.muzzleFlash=0;
    this.spawnShieldTimer=0;
    this.tunnelCooldown=0;this.teleportTimer=0;
    // Screen shake contribution
    this.shakeAmt=0;
    this.moveAnim=0;
    this.vx=0;this.vy=0;
    this.turnInput=0;
    this.lastTrackX=x;this.lastTrackY=y;
    this.botNav={
      path:[],
      waypoint:null,
      lastPlanTime:-1,
      startKey:'',
      goalKey:'',
      lastX:x,
      lastY:y,
      stuckMs:0,
      forceRepath:false,
    };
  }
  get col(){return TANK_DEF[this.type].col;}
  get dark(){return TANK_DEF[this.type].dark;}
  get hi(){return TANK_DEF[this.type].hi;}
  get name(){return TANK_DEF[this.type].name;}
  get maxBounces(){return this.baseBounces+(this.bounceBonus?6:0);}
  get curFireMs(){return this.rapid?this.fireMs*.38:this.fireMs;}
  get hasBreachShots(){return this.wallBreak&&this.wallBreakTimer>0;}

  applyPU(type,audio){
    audio.powerup();
    switch(type){
      case'RAPID':  this.rapid=true; this.rapidTimer=PU_DEF.RAPID.dur; break;
      case'TRIPLE': this.triple=true;this.tripleTimer=PU_DEF.TRIPLE.dur;break;
      case'SHIELD': this.shield=true;break;
      case'BOUNCE': this.bounceBonus=true;this.bounceTimer=PU_DEF.BOUNCE.dur;break;
      case'BREACH': this.wallBreak=true;this.wallBreakTimer=PU_DEF.BREACH.dur;break;
      case'GHOST':     this.ghost=true;    this.ghostTimer=PU_DEF.GHOST.dur;       break;
      case'SHRAPNEL':  this.shrapnel=true; this.shrapnelTimer=PU_DEF.SHRAPNEL.dur; break;
      case'HSPEED':    this.hspeed=true;   this.hspeedFuel=PU_DEF.HSPEED.dur;      break;
      case'MINE':      this.mineCount=3;   this.mineCharge=0;                       break;
      case'RADAR':
        this.radarPing=true;
        this.radarPulses=[];
        this.radarNextPulse=0; // emit first pulse on next update
        this.radarPulsesLeft=RADAR_PULSE_COUNT;
        break;
    }
  }

  update(input,dt,arena,bullets,audio,now,controlState=null,landMines=null){
    // Tick PU timers
    if(this.rapid){this.rapidTimer-=dt;if(this.rapidTimer<=0)this.rapid=false;}
    if(this.triple){this.tripleTimer-=dt;if(this.tripleTimer<=0)this.triple=false;}
    if(this.bounceBonus){this.bounceTimer-=dt;if(this.bounceTimer<=0)this.bounceBonus=false;}
    if(this.wallBreak){this.wallBreakTimer-=dt;if(this.wallBreakTimer<=0)this.wallBreak=false;}
    if(this.ghost){this.ghostTimer-=dt;if(this.ghostTimer<=0)this.ghost=false;}
    if(this.shrapnel){this.shrapnelTimer-=dt;if(this.shrapnelTimer<=0)this.shrapnel=false;}
    // Radar ping: emit pulses on schedule, advance each pulse radius
    if(this.radarPing&&this.radarPulsesLeft>0&&now>=this.radarNextPulse){
      this.radarPulses.push({r:0});
      this.radarNextPulse=now+RADAR_PULSE_INTERVAL;
      this.radarPulsesLeft--;
      if(this.radarPulsesLeft===0)this.radarPing=false;
    }
    if(this.radarPulses.length>0){
      const dr=RADAR_PULSE_SPD*(dt/1000);
      this.radarPulses.forEach(p=>{p.r+=dr;});
      this.radarPulses=this.radarPulses.filter(p=>p.r<RADAR_PULSE_MAX+RADAR_PULSE_WIDTH);
    }
    if(this.muzzleFlash>0)this.muzzleFlash-=dt;
    if(this.spawnShieldTimer>0)this.spawnShieldTimer-=dt;
    if(this.tunnelCooldown>0)this.tunnelCooldown-=dt;
    if(this.teleportTimer>0)this.teleportTimer-=dt;
    if(this.shakeAmt>0)this.shakeAmt-=dt*.003;

    if(!this.alive){
      this.respawnTimer-=dt;
      return;
    }

    const hold=(key)=>controlState?!!controlState.held?.[key]:input.isDown(this.controls[key]);
    const tap=(key)=>controlState?!!controlState.pressed?.[key]:input.wasPressed(this.controls[key]);

    let moving=false;
    const touchVector=controlState?.touchVector||(!controlState?input.getTouchVector(this.playerNum):null);
    this.turnInput=0;
    if(touchVector){
      const targetAngle=Math.atan2(touchVector.x,-touchVector.y);
      let delta=((targetAngle-this.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
      const turnLimit=this.rot*2.8;
      const prevAngle=this.angle;
      if(Math.abs(delta)<=turnLimit)this.angle=targetAngle;
      else this.angle+=Math.sign(delta)*turnLimit;
      const actualTurn=((this.angle-prevAngle+Math.PI*3)%(Math.PI*2))-Math.PI;
      this.turnInput=Math.abs(actualTurn)>0.001?Math.max(-1,Math.min(1,actualTurn/this.rot)):0;
      const moveScale=Math.max(.2,touchVector.magnitude);
      const curSpd=this.speed*(this.hspeed?2.1:1.0);
      const tvx=Math.sin(this.angle)*curSpd*moveScale*1.15;
      const tvy=-Math.cos(this.angle)*curSpd*moveScale*1.15;
      this.vx+=(tvx-this.vx)*0.22;this.vy+=(tvy-this.vy)*0.22;
      moving=true;
    }else{
      // Rotate
      if(hold('left')) this.angle-=this.rot;
      if(hold('right'))this.angle+=this.rot;
      this.turnInput=(hold('left')?-1:0)+(hold('right')?1:0);

      // Move
      const curSpd=this.speed*(this.hspeed?2.1:1.0);
      const fwd=hold('up'),bck=hold('down');
      if(fwd){
        const tvx=Math.sin(this.angle)*curSpd,tvy=-Math.cos(this.angle)*curSpd;
        this.vx+=(tvx-this.vx)*0.22;this.vy+=(tvy-this.vy)*0.22;
        moving=true;
      }else if(bck){
        const tvx=-Math.sin(this.angle)*curSpd*.7,tvy=Math.cos(this.angle)*curSpd*.7;
        this.vx+=(tvx-this.vx)*0.22;this.vy+=(tvy-this.vy)*0.22;
        moving=true;
      }else{
        this.vx*=0.90;this.vy*=0.90;
      }
    }
    this.x+=this.vx;this.y+=this.vy;
    if(moving||Math.hypot(this.vx,this.vy)>0.15)this.moveAnim+=.2;
    // HIGH SPEED fuel depletes only while the tank is actually moving
    if(this.hspeed){
      if(moving||Math.hypot(this.vx,this.vy)>0.25)this.hspeedFuel-=dt;
      if(this.hspeedFuel<=0){this.hspeed=false;this.hspeedFuel=0;}
    }

    // Wall resolve
    if(!this.ghost)this.resolveWalls(arena);
    else{this.x=Math.max(16,Math.min(W-16,this.x));this.y=Math.max(HUD+16,Math.min(ARENA_BOTTOM-16,this.y));}

    // Fire
    const fireHeld=hold('fire')||(!controlState&&input.isTouchPlayer(this.playerNum)&&input.fire.active);
    const fireTapped=tap('fire')||(!controlState&&input.isTouchPlayer(this.playerNum)&&input.wasPressed('TouchFire'));
    // Mine charge — hold fire 3s to deploy a mine (CPU tanks skip mine logic)
    if(!this.isCPU&&this.mineCount>0&&landMines){
      if(fireHeld){
        this.mineCharge=Math.min(this.mineCharge+dt,3000);
        if(this.mineCharge>=3000){
          // Deploy mine from the back of the tank
          const mx=this.x-Math.sin(this.angle)*22;
          const my=this.y+Math.cos(this.angle)*22;
          landMines.push(new LandMine(mx,my,this.playerNum));
          audio.powerup();
          this.mineCount--;
          if(this.mineCount<=0)this.mineCharge=0;
          else this.mineCharge=0;
        }
      }else{
        this.mineCharge=0;
      }
    }else if(!fireHeld){
      this.mineCharge=0;
    }
    // Block normal fire while mine charge is building (>200ms = committed to mining)
    const mineCharging=!this.isCPU&&this.mineCount>0&&this.mineCharge>200;
    const wantsFire=!mineCharging&&((this.rapid?fireHeld:fireTapped)||!!controlState?.held?.fire);
    if(wantsFire&&this.spawnShieldTimer<=0&&now-this.lastFireTime>this.curFireMs){
      this.doFire(bullets,audio,now);
    }
  }

  resolveWalls(arena){
    const r=15;
    const cc=Math.floor(this.x/TS),cr=Math.floor((this.y-HUD)/TS);
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        const row=cr+dr,col=cc+dc;
        if(!arena.isWall(col,row))continue;
        const wx=col*TS,wy=row*TS+HUD;
        const cx=Math.max(wx,Math.min(this.x,wx+TS));
        const cy=Math.max(wy,Math.min(this.y,wy+TS));
        const dx=this.x-cx,dy=this.y-cy;
        const d=Math.hypot(dx,dy);
        if(d<r&&d>0){const push=r-d;this.x+=dx/d*push;this.y+=dy/d*push;}
        else if(d===0){this.x+=r;}
      }
    }
    this.x=Math.max(r,Math.min(W-r,this.x));
    this.y=Math.max(HUD+r,Math.min(H-r,this.y));
  }

  doFire(bullets,audio,now){
    this.lastFireTime=now;
    this.muzzleFlash=120;
    const bl=18;
    const bx=this.x+Math.sin(this.angle)*bl;
    const by=this.y-Math.cos(this.angle)*bl;
    const pan=(this.x/W)*2-1;
    audio.shoot(pan*.5);
    const hasShrap=this.shrapnel&&this.shrapnelTimer>0;
    if(this.triple){
      [-0.18,0,.18].forEach(sp=>{
        bullets.push(new Bullet(bx,by,this.angle+sp,this,this.maxBounces,this.col,this.hasBreachShots,hasShrap));
      });
    }else{
      bullets.push(new Bullet(bx,by,this.angle,this,this.maxBounces,this.col,this.hasBreachShots,hasShrap));
    }
  }

  die(ps,audio){
    this.alive=false;this.respawnTimer=RESPAWN_MS;
    this.shield=false;this.ghost=false;this.rapid=false;this.triple=false;this.bounceBonus=false;this.wallBreak=false;
    this.wallBreakTimer=0;this.shrapnel=false;this.shrapnelTimer=0;this.hspeed=false;this.hspeedFuel=0;
    this.radarPing=false;this.radarPulses=[];this.radarPulsesLeft=0;
    this.mineCount=0;this.mineCharge=0;
    // White flash core
    ps.emit(this.x,this.y,'#ffffff',24,16,5,7);
    // Bright yellow-white inner burst
    ps.emit(this.x,this.y,'#ffff99',20,13,6,12);
    // Orange fireball
    ps.emit(this.x,this.y,'#ff9900',28,10,8,30);
    ps.emit(this.x,this.y,'#ff5500',24,8,9,40);
    // Deep red outer ring
    ps.emit(this.x,this.y,'#cc1100',18,12,6,22);
    // Tank-colored debris chunks
    for(let i=0;i<6;i++)ps.emit(this.x,this.y,this.col,5,7+i*1.5,4+i,45+i*10);
    // Dark smoke billows (slow, large, long-lived)
    ps.emit(this.x,this.y,'#1a1a1a',14,3,14,80);
    ps.emit(this.x,this.y,'#333333',12,2,18,100);
    // Bright embers
    ps.emit(this.x,this.y,'#ffcc00',16,14,2,18);
    const pan=(this.x/W)*2-1;
    audio.explode(pan*.5);
    this.shakeAmt=2.5;
  }

  respawn(arena){
    // Pick spawn zone based on player
    const zoneRow=this.playerNum===1?[ROWS-10,ROWS-5]:[2,7];
    for(let i=0;i<80;i++){
      const col=1+Math.floor(Math.random()*(COLS-2));
      const row=zoneRow[0]+Math.floor(Math.random()*(zoneRow[1]-zoneRow[0]));
      if(!arena.isWall(col,row)){
        this.x=col*TS+TS/2;this.y=row*TS+TS/2+HUD;
        this.botNav.path=[];this.botNav.waypoint=null;this.botNav.lastPlanTime=-1;
        this.botNav.startKey='';this.botNav.goalKey='';this.botNav.lastX=this.x;this.botNav.lastY=this.y;
        this.botNav.stuckMs=0;this.botNav.forceRepath=false;
        this.alive=true;this.respawnTimer=0;this.spawnShieldTimer=2000;return;
      }
    }
    // Fallback center
    this.x=W/2;this.y=H/2;
    this.botNav.path=[];this.botNav.waypoint=null;this.botNav.lastPlanTime=-1;
    this.botNav.startKey='';this.botNav.goalKey='';this.botNav.lastX=this.x;this.botNav.lastY=this.y;
    this.botNav.stuckMs=0;this.botNav.forceRepath=false;
    this.alive=true;this.respawnTimer=0;this.spawnShieldTimer=2000;
  }

  draw(ctx,now){
    if(!this.alive)return;
    const d=TANK_DEF[this.type];
    const tread=Math.sin(this.moveAnim)*1.5;
    ctx.save();
    ctx.translate(this.x,this.y);ctx.rotate(this.angle);
    if(this.ghost)ctx.globalAlpha=0.38;
    else if(this.spawnShieldTimer>0)ctx.globalAlpha=0.35+0.65*(Math.sin(now*0.05)>0?1:0);
    else if(this.teleportTimer>0)ctx.globalAlpha=1-(this.teleportTimer/500);

    // Drop shadow
    ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.shadowOffsetX=3;ctx.shadowOffsetY=3;

    // Treads
    ctx.fillStyle='#111';
    ctx.fillRect(-17,-14,7,28);
    ctx.fillRect(10,-14,7,28);
    ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.shadowBlur=0;
    // Tread detail
    ctx.fillStyle='#2a2a2a';
    for(let i=0;i<7;i++){
      const oy=((tread+i*4)%28)-14;
      ctx.fillRect(-17,oy,7,2.5);
      ctx.fillRect(10,oy,7,2.5);
    }
    ctx.fillStyle='#333';
    for(let i=0;i<7;i++){
      ctx.fillRect(-17,-13+i*4,7,1);
      ctx.fillRect(10,-13+i*4,7,1);
    }

    // Hull
    ctx.fillStyle=d.dark;ctx.fillRect(-10,-13,20,26);
    ctx.fillStyle=d.col; ctx.fillRect(-9,-12,18,24);
    // Highlight
    ctx.fillStyle='rgba(255,255,255,.13)';
    ctx.fillRect(-9,-12,18,4);ctx.fillRect(-9,-12,4,24);
    // Shadow edge
    ctx.fillStyle='rgba(0,0,0,.25)';
    ctx.fillRect(8,-12,1,24);ctx.fillRect(-9,11,18,1);
    // Center stripe
    ctx.fillStyle=d.dark;ctx.fillRect(-9,-2,18,4);
    // Rivets
    ctx.fillStyle=d.dark;
    [[-8,-10],[7,-10],[-8,9],[7,9]].forEach(([rx,ry])=>{
      ctx.beginPath();ctx.arc(rx,ry,1.8,0,Math.PI*2);ctx.fill();
    });
    // Hatch
    ctx.fillStyle=d.dark;
    ctx.beginPath();ctx.arc(0,3,5.5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=d.col;
    ctx.beginPath();ctx.arc(0,3,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.3)';
    ctx.beginPath();ctx.arc(-1,2,2,0,Math.PI*2);ctx.fill();

    // Turret base
    ctx.fillStyle=d.dark;ctx.fillRect(-6,-6,12,12);
    ctx.fillStyle=d.col; ctx.fillRect(-5,-5,10,10);
    ctx.fillStyle=d.hi; ctx.fillRect(-5,-5,10,2);

    // Barrel
    ctx.shadowColor=d.col;ctx.shadowBlur=5;
    ctx.fillStyle=d.dark;ctx.fillRect(-3.5,-20,7,20);
    ctx.fillStyle='#444';   ctx.fillRect(-2.5,-20,5,19);
    ctx.fillStyle=d.hi;     ctx.fillRect(-2.5,-20,2,19);
    // Muzzle brake
    ctx.fillStyle=d.dark;ctx.fillRect(-4.5,-22,9,4);
    ctx.fillStyle='#666';   ctx.fillRect(-3.5,-21,7,3);
    ctx.shadowBlur=0;

    // Muzzle flash
    if(this.muzzleFlash>0){
      const alpha=Math.min(1,this.muzzleFlash/80);
      ctx.globalAlpha=(this.ghost?.38:1)*alpha;
      ctx.shadowColor='#ffee88';ctx.shadowBlur=20;
      ctx.fillStyle='#ffee88';
      ctx.beginPath();ctx.arc(0,-24,7*alpha,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(0,-24,3*alpha,0,Math.PI*2);ctx.fill();
      ctx.shadowBlur=0;
      ctx.globalAlpha=this.ghost?.38:1;
    }

    // Shield
    if(this.shield){
      ctx.globalAlpha=(this.ghost?.38:1)*(.55+.3*Math.sin(now*.006));
      ctx.strokeStyle=PU_DEF.SHIELD.col;ctx.lineWidth=3;
      ctx.shadowColor=PU_DEF.SHIELD.col;ctx.shadowBlur=14;
      ctx.beginPath();ctx.arc(0,0,24,0,Math.PI*2);ctx.stroke();
      ctx.shadowBlur=0;
    }

    // Mine charge arc — fills up behind tank as player holds fire
    if(this.mineCount>0&&this.mineCharge>0){
      const pct=this.mineCharge/3000;
      ctx.strokeStyle=pct>0.85?'#ff6622':'#cc4400';
      ctx.lineWidth=3;
      ctx.shadowColor='#cc4400';ctx.shadowBlur=8*pct;
      ctx.beginPath();
      ctx.arc(0,0,27,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
      ctx.stroke();
      ctx.shadowBlur=0;
    }

    ctx.globalAlpha=1;ctx.restore();
  }
}

/* ══════════════════════════════════════════════════
   ARENA
══════════════════════════════════════════════════ */
class Arena{
  constructor(){this.grid=[];this.tunnels=[];}
  load(mapData){this.grid=mapData.map(r=>[...r]);}
  loadTunnels(pairs){
    this.tunnels=pairs||[];
    for(const t of this.tunnels){
      this.grid[t.a.row][t.a.col]=0;
      this.grid[t.b.row][t.b.col]=0;
    }
  }
  getTunnelAt(col,row){
    for(const t of this.tunnels){
      if(t.a.col===col&&t.a.row===row)return{partner:t.b,col:t.col};
      if(t.b.col===col&&t.b.row===row)return{partner:t.a,col:t.col};
    }
    return null;
  }
  inBounds(col,row){return col>=0&&col<COLS&&row>=0&&row<ROWS;}
  isWall(col,row){
    if(col<0||col>=COLS||row<0||row>=ROWS)return true;
    return this.grid[row][col]===1;
  }
  cellCenter(col,row){
    return{x:col*TS+TS/2,y:row*TS+TS/2+HUD};
  }
  worldToCell(x,y){
    return{
      col:Math.max(0,Math.min(COLS-1,Math.floor(x/TS))),
      row:Math.max(0,Math.min(ROWS-1,Math.floor((y-HUD)/TS))),
    };
  }
  solid(x,y){
    if(x<0||x>=W||y<HUD||y>=ARENA_BOTTOM)return true;
    return this.isWall(Math.floor(x/TS),Math.floor((y-HUD)/TS));
  }
  canTankOccupy(x,y,r=15){
    if(x-r<0||x+r>W||y-r<HUD||y+r>ARENA_BOTTOM)return false;
    const samples=[
      [0,0],[r,0],[-r,0],[0,r],[0,-r],
      [r*.7,r*.7],[r*.7,-r*.7],[-r*.7,r*.7],[-r*.7,-r*.7],
    ];
    return samples.every(([dx,dy])=>!this.solid(x+dx,y+dy));
  }
  isBreakableWall(col,row){
    if(!this.isWall(col,row))return false;
    return col>0&&col<COLS-1&&row>0&&row<ROWS-1;
  }
  breakWallAt(points){
    if(!Array.isArray(points))return null;
    for(const pt of points){
      if(!pt)continue;
      const {col,row}=this.worldToCell(pt.x,pt.y);
      if(!this.isBreakableWall(col,row))continue;
      this.grid[row][col]=0;
      return this.cellCenter(col,row);
    }
    return null;
  }
  randomFloor(){
    for(let i=0;i<200;i++){
      const c=1+Math.floor(Math.random()*(COLS-2));
      const r=1+Math.floor(Math.random()*(ROWS-2));
      if(!this.isWall(c,r))return{x:c*TS+TS/2,y:r*TS+TS/2+HUD};
    }
    return{x:W/2,y:H/2};
  }

  draw(ctx,now){
    // Floor
    ctx.fillStyle=PAL.floor;
    ctx.fillRect(0,HUD,W,AH);
    // Grid lines
    ctx.strokeStyle=PAL.grid;ctx.lineWidth=1;
    for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*TS,HUD);ctx.lineTo(c*TS,ARENA_BOTTOM);ctx.stroke();}
    for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,HUD+r*TS);ctx.lineTo(W,HUD+r*TS);ctx.stroke();}
    // Walls
    for(let row=0;row<ROWS;row++){
      for(let col=0;col<COLS;col++){
        if(this.grid[row][col]!==1)continue;
        const wx=col*TS,wy=row*TS+HUD;
        // Shadow
        ctx.fillStyle=PAL.wallSH;
        ctx.fillRect(wx+3,wy+3,TS,TS);
        // Main
        ctx.fillStyle=PAL.wall;
        ctx.fillRect(wx,wy,TS,TS);
        // Highlight edge (top+left)
        ctx.fillStyle=PAL.wallHL;
        ctx.fillRect(wx,wy,TS,2);
        ctx.fillRect(wx,wy,2,TS);
        // Groove detail
        ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=1;
        ctx.strokeRect(wx+4,wy+4,TS-8,TS-8);
        // Rivet dots
        ctx.fillStyle='rgba(255,255,255,.06)';
        [[4,4],[TS-6,4],[4,TS-6],[TS-6,TS-6]].forEach(([dx,dy])=>{
          ctx.beginPath();ctx.arc(wx+dx,wy+dy,2,0,Math.PI*2);ctx.fill();
        });
      }
    }
    // Tunnels
    for(const t of this.tunnels){
      for(const ep of [t.a,t.b]){
        const wx=ep.col*TS,wy=ep.row*TS+HUD;
        const cx=wx+TS/2,cy=wy+TS/2;
        const pulse=0.65+0.35*Math.sin(now*0.0045);
        // Dark portal floor
        ctx.fillStyle='rgba(0,0,0,0.6)';
        ctx.fillRect(wx+1,wy+1,TS-2,TS-2);
        // Colored border with glow
        ctx.save();
        ctx.shadowColor=t.col;ctx.shadowBlur=14*pulse;
        ctx.strokeStyle=t.col;ctx.lineWidth=3;
        ctx.strokeRect(wx+2.5,wy+2.5,TS-5,TS-5);
        ctx.restore();
        // Inner color fill
        ctx.globalAlpha=0.15*pulse;
        ctx.fillStyle=t.col;
        ctx.fillRect(wx+5,wy+5,TS-10,TS-10);
        ctx.globalAlpha=1;
        // Rotating portal dots
        for(let i=0;i<8;i++){
          const a=(i/8)*Math.PI*2+now*0.002;
          ctx.globalAlpha=((i+1)/8)*0.9*pulse;
          ctx.fillStyle=t.col;
          ctx.beginPath();
          ctx.arc(cx+Math.cos(a)*TS*0.26,cy+Math.sin(a)*TS*0.26,2.5,0,Math.PI*2);
          ctx.fill();
        }
        ctx.globalAlpha=1;
      }
    }
  }
}

/* ══════════════════════════════════════════════════
   CRT OVERLAY  (drawn once, static)
══════════════════════════════════════════════════ */
function buildCRT(canvas){
  const ctx=canvas.getContext('2d');
  const w=canvas.width,h=canvas.height;
  // Scanlines
  for(let y=0;y<h;y+=2){
    ctx.fillStyle='rgba(0,0,0,.18)';
    ctx.fillRect(0,y,w,1);
  }
  // Vignette
  const g=ctx.createRadialGradient(w/2,h/2,h*.25,w/2,h/2,h*.78);
  g.addColorStop(0,'transparent');
  g.addColorStop(1,'rgba(0,0,0,.7)');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  // Slight RGB fringe at edges (chromatic aberration illusion)
  const eg=ctx.createLinearGradient(0,0,w,0);
  eg.addColorStop(0,'rgba(255,0,0,.03)');
  eg.addColorStop(.5,'transparent');
  eg.addColorStop(1,'rgba(0,0,255,.03)');
  ctx.fillStyle=eg;ctx.fillRect(0,0,w,h);
}

class OnlineSession{
  constructor(url,onMessage,onDisconnect){
    this.url=url;
    this.onMessage=onMessage;
    this.onDisconnect=onDisconnect;
    this.ws=null;
  }
  connect(){
    return new Promise((resolve,reject)=>{
      let settled=false;
      const ws=new WebSocket(this.url);
      this.ws=ws;
      ws.addEventListener('open',()=>{
        settled=true;
        resolve();
      });
      ws.addEventListener('message',(event)=>{
        let msg;
        try{msg=JSON.parse(event.data);}catch(err){return;}
        this.onMessage?.(msg);
      });
      ws.addEventListener('error',()=>{
        if(!settled)reject(new Error('Could not reach the online relay.'));
      });
      ws.addEventListener('close',()=>{
        if(!settled)reject(new Error('The online relay closed before the room connected.'));
        this.onDisconnect?.();
      });
    });
  }
  send(type,payload={}){
    if(!this.ws||this.ws.readyState!==WebSocket.OPEN)return;
    this.ws.send(JSON.stringify({type,...payload}));
  }
  close(){
    if(!this.ws)return;
    try{this.send('LEAVE');}catch(err){}
    this.ws.close();
    this.ws=null;
  }
}

/* ══════════════════════════════════════════════════
   GAME CONTROLLER
══════════════════════════════════════════════════ */
const STATE={BOOT:0,SPLASH:1,MENU:2,SELECT:3,PLAYING:4,END:5,LOBBY:6,PAUSE:7};

class Game{
  constructor(){
    this.gc=document.getElementById('gc');
    this.ctx=this.gc.getContext('2d');
    this.crt=document.getElementById('crt');
    this.state=STATE.BOOT;
    this.audio=new AudioManager();
    this.input=new InputManager();
    this.arena=new Arena();
    this.ps=new ParticleSystem();
    this.bullets=[];this.powerups=[];this.landMines=[];this.tanks=[];this.tracks=[];
    this.onlineEvents=[];
    this.now=0;this.dt=FRAME_MS;this.last=0;
    this.accumulator=0;this.fixedStep=FRAME_MS;
    this.shake=0;this.shakeX=0;this.shakeY=0;

    // Boot
    this.bootTimer=0;
    this.bootLines=[];
    this.bootLineIdx=0;
    this.bootCharIdx=0;
    this.bootLinePause=0;
    this.bootReady=false;
    this.bootSequence=[
      'INITIALIZING SYSTEM...',
      'LOADING COMBAT GRID...',
      'CALIBRATING TURRETS...',
      'ESTABLISHING SECURE LINK...',
      'CLICK TO LAUNCH...'
    ];

    // Splash
    this.splashTimer=0;this.splashBlink=true;this.splashBlinkTimer=0;

    // Menu
    this.menuSel=0;
    this.menuMode='main';this.localModeSel=0;this.onlineModeSel=0;this.settingsSel=0;this.shareSel=0;this.singlePlayer=false;this.demoMode=false;
    this.attractIdle=0;this.attractMode=false;this.attractPhase=0;this.attractTime=0;this.attractTankP=0;this._attractTanks=null;
    this.gameMode='local';
    this.menuNotice='';
    this.shareNotice='';
    this.shareQrImage=null;
    this.shareQrStatus='idle';
    this.menuItems=[
      {label:'PLAY LOCAL',  fn:()=>this.goLocalMode()},
      {label:'PLAY ONLINE', fn:()=>this.goOnlineMode()},
      {label:'POWER-UPS',   fn:()=>this.goPowerups()},
      {label:'SETTINGS',    fn:()=>this.goSettings()},
      {label:'EXIT',        fn:()=>this.exitGame()},
    ];
    this.localItems=[
      {label:'1 PLAYER', fn:()=>this.startLocalMode(true),  note:'SOLO VS CPU'},
      {label:'2 PLAYER', fn:()=>this.startLocalMode(false), note:'COUCH BATTLE'},
      {label:'DEMO',     fn:()=>this.startDemoMode(),       note:'CPU VS CPU'},
      {label:'BACK', fn:()=>{this.menuMode='main';this.localModeSel=0;}, note:'RETURN TO MENU'},
    ];
    this.onlineItems=[
      {label:'HOST ROOM', fn:()=>this.hostOnlineRoom(), note:'CREATE INVITE CODE'},
      {label:'JOIN ROOM', fn:()=>this.joinOnlineRoom(), note:'ENTER A SHARED CODE'},
      {label:'BACK', fn:()=>{this.menuMode='main';this.onlineModeSel=0;}, note:'RETURN TO MENU'},
    ];
    this.ricochetOn=true;
    this.friendlyFire=false;
    this.settingsItems=[
      {label:()=>this.audio.muted?'AUDIO: OFF':'AUDIO: ON', fn:()=>this.toggleMute(), note:'TOGGLE THEME AND SFX'},
      {label:()=>this.ricochetOn?'RICOCHET: ON':'RICOCHET: OFF', fn:()=>{this.ricochetOn=!this.ricochetOn;}, note:'TOGGLE BULLET BOUNCING'},
      {label:()=>this.friendlyFire?'FRIENDLY FIRE: ON':'FRIENDLY FIRE: OFF', fn:()=>{this.friendlyFire=!this.friendlyFire;}, note:'OWN BULLETS CAN KILL YOU'},
      {label:'SHOW QR CODE', fn:()=>this.goShareScreen(), note:'SHARE THE LIVE GAME LINK'},
      {label:'BACK', fn:()=>{this.menuMode='main';this.settingsSel=0;this.menuNotice='';}, note:'RETURN TO MENU'},
    ];
    this.shareItems=[
      {label:'COPY LINK', fn:()=>this.copyShareLink(), note:'COPY GAME ADDRESS'},
      {label:'BACK', fn:()=>{this.menuMode='settings';this.shareSel=0;this.shareNotice='';}, note:'RETURN TO SETTINGS'},
    ];

    // Select
    this.p1Sel=0;this.p2Sel=1;this.p1Ready=false;this.p2Ready=false;
    this.selectBlink=0;this.startGameTimer=-1;

    // Playing
    this.mapIdx=0;this.roundNum=0;
    this.puTimer=0;this.matchOver=false;
    this.winner=null;this.winTimer=0;
    this.killFeed=[];// {text,timer,col}
    this.countdownVal=0;this.countdownTimer=0;

    // End
    this.endTimer=0;this.endSel=0;

    // Pause
    this.pauseSel=0;
    this.pauseReason='';

    // Online
    this.onlineSession=null;
    this.online={
      active:false,connecting:false,playerNum:1,roomCode:'',
      status:'',remoteConnected:false,inputTimer:0,snapshotTimer:0,
      lastInputSig:'',guestWaiting:false,remoteFireHeld:false,
    };
  }

  init(){
    buildCRT(this.crt);
    this.audio.init();
    this.input.setTouchLayout(()=>this.getTouchLayout());
    this.input.setTouchPlayerNum(1);
    this.ctx.font='18px "Press Start 2P"';// preload
    window.render_game_to_text=()=>this.renderGameToText();
    window.advanceTime=(ms)=>this.advanceTime(ms);
    requestAnimationFrame(ts=>this.loop(ts));
  }

  loop(ts){
    if(!this.last)this.last=ts;
    const frameDt=Math.min(ts-this.last,100);
    this.last=ts;this.now=ts;
    this.accumulator+=frameDt;
    let clearedPressed=false;
    while(this.accumulator>=this.fixedStep){
      this.dt=this.fixedStep;
      this.update();
      this.accumulator-=this.fixedStep;
      if(!clearedPressed){
        this.input.clearPressed();
        clearedPressed=true;
      }
    }
    requestAnimationFrame(t=>this.loop(t));
    this.draw();
  }

  advanceTime(ms){
    this.accumulator+=Math.max(ms,this.fixedStep);
    let clearedPressed=false;
    while(this.accumulator>=this.fixedStep){
      this.dt=this.fixedStep;
      this.now+=this.fixedStep;
      this.update();
      this.accumulator-=this.fixedStep;
      if(!clearedPressed){
        this.input.clearPressed();
        clearedPressed=true;
      }
    }
    this.draw();
  }

  resetOnlineState(){
    this.online={
      active:false,connecting:false,playerNum:1,roomCode:'',
      status:'',remoteConnected:false,inputTimer:0,snapshotTimer:0,
      lastInputSig:'',guestWaiting:false,remoteFireHeld:false,
    };
    this.input.setTouchPlayerNum(1);
  }
  isOnlineMode(){return this.gameMode==='online'&&this.online.active;}
  isOnlineHost(){return this.isOnlineMode()&&this.online.playerNum===1;}
  isOnlineGuest(){return this.isOnlineMode()&&this.online.playerNum===2;}
  getPlayerControls(playerNum){
    if(playerNum===1&&this.singlePlayer&&!this.isOnlineMode()&&!this.input.shouldShowTouchControls()){
      return{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',fire:'Space'};
    }
    return playerNum===1
      ? {left:'KeyA',right:'KeyD',up:'KeyW',down:'KeyS',fire:'Space'}
      : {left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',down:'ArrowDown',fire:'Enter'};
  }
  getActiveMenuContext(){
    if(this.menuMode==='local')return{items:this.localItems,selectedKey:'localModeSel',label:'LOCAL BATTLE SETUP'};
    if(this.menuMode==='online')return{items:this.onlineItems,selectedKey:'onlineModeSel',label:'ONLINE OPS'};
    if(this.menuMode==='settings')return{items:this.settingsItems,selectedKey:'settingsSel',label:'SYSTEM SETTINGS'};
    if(this.menuMode==='share')return{items:this.shareItems,selectedKey:'shareSel',label:'SCAN OR COPY TO SHARE'};
    if(this.menuMode==='powerups')return{items:[{label:'BACK',fn:()=>{this.menuMode='main';}}],selectedKey:'menuSel',label:'POWER-UP GUIDE'};
    return{items:this.menuItems,selectedKey:'menuSel',label:this.audio.muted?'[AUDIO: OFF]':'[AUDIO: ON]'};
  }
  resolveMenuLabel(item){
    return typeof item.label==='function'?item.label():item.label;
  }
  getShareUrl(){
    const {origin,hostname}=window.location||{};
    if(hostname==='localhost'||hostname==='127.0.0.1')return PROD_SHARE_URL;
    return origin&&/^https?:/i.test(origin)?origin:PROD_SHARE_URL;
  }
  getShareQrSrc(){
    return `https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=12&data=${encodeURIComponent(this.getShareUrl())}`;
  }
  ensureShareQr(){
    if(this.shareQrImage||this.shareQrStatus==='loading')return;
    this.shareQrStatus='loading';
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>{
      this.shareQrImage=img;
      this.shareQrStatus='ready';
    };
    img.onerror=()=>{
      this.shareQrImage=null;
      this.shareQrStatus='error';
    };
    img.src=this.getShareQrSrc();
  }
  blankControlState(){
    return{
      held:{left:false,right:false,up:false,down:false,fire:false},
      pressed:{left:false,right:false,up:false,down:false,fire:false},
      touchVector:null,
    };
  }
  flagsToControlState(flags){
    const held={left:!!flags.left,right:!!flags.right,up:!!flags.up,down:!!flags.down,fire:!!flags.fire};
    return{held,pressed:{...held},touchVector:null};
  }
  getOnlineInputState(playerNum){
    const controls=this.getPlayerControls(playerNum);
    const touchVector=this.input.getTouchVector(playerNum);
    return{
      held:{
        left:this.input.isDown(controls.left),
        right:this.input.isDown(controls.right),
        up:this.input.isDown(controls.up),
        down:this.input.isDown(controls.down),
        fire:this.input.isDown(controls.fire)||(this.input.isTouchPlayer(playerNum)&&this.input.isDown('TouchFire')),
      },
      pressed:{
        left:this.input.wasPressed(controls.left),
        right:this.input.wasPressed(controls.right),
        up:this.input.wasPressed(controls.up),
        down:this.input.wasPressed(controls.down),
        fire:this.input.wasPressed(controls.fire)||(this.input.isTouchPlayer(playerNum)&&this.input.wasPressed('TouchFire')),
      },
      touchVector:touchVector?{x:+touchVector.x.toFixed(3),y:+touchVector.y.toFixed(3),magnitude:+touchVector.magnitude.toFixed(3)}:null,
    };
  }
  canOpenPauseMenu(){
    return this.singlePlayer||this.isOnlineMode();
  }
  getPauseOptions(){
    if(this.singlePlayer||this.demoMode)return['RESUME','MAIN MENU'];
    if(this.isOnlineMode())return['RESUME','SURRENDER'];
    return['RESUME'];
  }
  openPauseMenu(source='local'){
    if(!this.canOpenPauseMenu()||this.state!==STATE.PLAYING)return;
    this.state=STATE.PAUSE;
    this.pauseSel=0;
    this.pauseReason=this.isOnlineMode()?'ONLINE MATCH PAUSED':'GAME PAUSED';
    if(source==='local'&&this.isOnlineMode()){
      this.onlineSession?.send('GAME_EVENT',{event:{kind:'PAUSE',paused:true}});
    }
  }
  closePauseMenu(source='local'){
    if(this.state!==STATE.PAUSE)return;
    this.state=STATE.PLAYING;
    if(source==='local'&&this.isOnlineMode()){
      this.onlineSession?.send('GAME_EVENT',{event:{kind:'PAUSE',paused:false}});
    }
  }
  forceSurrender(loserPlayerNum){
    const winner=this.tanks.find(t=>t.playerNum!==loserPlayerNum);
    if(!winner)return;
    winner.kills=Math.max(winner.kills,KILLS_WIN);
    this.matchOver=false;
    this.winner=winner;
    this.goEnd();
  }
  commitPauseAction(action){
    if(action==='RESUME'){
      this.audio.menuSelect();
      this.closePauseMenu();
      return;
    }
    if(action==='MAIN MENU'){
      this.audio.menuSelect();
      this.goMenu();
      return;
    }
    if(action==='SURRENDER'){
      this.audio.menuSelect();
      if(this.isOnlineMode()){
        this.onlineSession?.send('GAME_EVENT',{event:{kind:'SURRENDER',playerNum:this.online.playerNum}});
        this.forceSurrender(this.online.playerNum);
      }
    }
  }

  /* ── SCREEN SHAKE ─────────────────────────────── */
  addShake(amt){this.shake=Math.max(this.shake,amt);}
  tickShake(){
    if(this.shake>0){
      this.shakeX=(Math.random()-.5)*this.shake*6;
      this.shakeY=(Math.random()-.5)*this.shake*6;
      this.shake-=this.dt*.006;
      if(this.shake<0)this.shake=0;
    }else{this.shakeX=0;this.shakeY=0;}
  }

  /* ══════════════════════════════════════════════
     UPDATE dispatcher
  ══════════════════════════════════════════════ */
  update(){
    this.tickShake();
    switch(this.state){
      case STATE.BOOT:    this.updateBoot();   break;
      case STATE.SPLASH:  this.updateSplash(); break;
      case STATE.MENU:    this.updateMenu();   break;
      case STATE.SELECT:  this.updateSelect(); break;
      case STATE.PLAYING: this.updatePlay();   break;
      case STATE.END:     this.updateEnd();    break;
      case STATE.LOBBY:   this.updateLobby();  break;
      case STATE.PAUSE:   this.updatePause();  break;
    }
  }

  /* ══════════════════════════════════════════════
     BOOT
  ══════════════════════════════════════════════ */
  updateBoot(){
    this.bootTimer+=this.dt;
    if(!this.bootReady){
      if(this.bootLinePause>0){
        this.bootLinePause-=this.dt;
      }else if(this.bootLineIdx<this.bootSequence.length){
        const target=this.bootSequence[this.bootLineIdx];
        if(this.bootTimer>=18){
          this.bootTimer=0;
          this.bootCharIdx++;
          if(this.bootCharIdx>target.length){
            this.bootLines.push(target);
            this.bootLineIdx++;
            this.bootCharIdx=0;
            this.bootLinePause=this.bootLineIdx===this.bootSequence.length?450:220;
            this.bootReady=this.bootLineIdx===this.bootSequence.length;
          }
        }
      }
      return;
    }
    if(this.input.anyPressed()){
      this.audio.resume();
      this.goSplash();
    }
  }

  goSplash(){
    this.state=STATE.SPLASH;this.splashTimer=0;this.splashBlink=true;this.splashBlinkTimer=0;
    this.audio.setThemeMode('title');
    this.audio.startTheme();
  }

  /* ══════════════════════════════════════════════
     SPLASH
  ══════════════════════════════════════════════ */
  updateSplash(){
    this.splashTimer+=this.dt;
    this.splashBlinkTimer+=this.dt;
    if(this.splashBlinkTimer>500){this.splashBlink=!this.splashBlink;this.splashBlinkTimer=0;}
    if(this.splashTimer>600&&this.input.anyPressed()){
      this.audio.resume();this.audio.menuSelect();this.goMenu();
    }
  }
  goMenu(notice=''){
    if(this.onlineSession){
      this.onlineSession.close();
      this.onlineSession=null;
    }
    this.resetOnlineState();
    this.state=STATE.MENU;this.menuSel=0;this.menuMode='main';this.localModeSel=0;this.onlineModeSel=0;this.settingsSel=0;this.shareSel=0;this.startGameTimer=-1;
    this.singlePlayer=false;this.demoMode=false;
    this.gameMode='local';
    this.menuNotice=notice;
    this.shareNotice='';
    this.audio.setThemeMode('title');
  }
  goLocalMode(){this.menuMode='local';this.localModeSel=0;this.menuNotice='';}
  goOnlineMode(){this.menuMode='online';this.onlineModeSel=0;this.menuNotice='';}
  goSettings(){this.menuMode='settings';this.settingsSel=0;this.menuNotice='';}
  goPowerups(){this.menuMode='powerups';this.menuNotice='';}
  goShareScreen(){
    this.menuMode='share';
    this.shareSel=0;
    this.shareNotice='';
    this.ensureShareQr();
  }
  startLocalMode(singlePlayer){
    this.gameMode='local';
    this.singlePlayer=singlePlayer;
    this.demoMode=false;
    this.input.setTouchPlayerNum(1);
    this.goSelect();
  }
  startDemoMode(){
    this.gameMode='local';
    this.singlePlayer=false;
    this.demoMode=true;
    // Pick two distinct random tanks
    this.p1Sel=Math.floor(Math.random()*TANK_ORDER.length);
    this.p2Sel=(this.p1Sel+1+Math.floor(Math.random()*(TANK_ORDER.length-1)))%TANK_ORDER.length;
    this.p1Ready=true;this.p2Ready=true;
    this.input.setTouchPlayerNum(1);
    this.startGame();
  }
  async ensureOnlineSession(){
    if(this.onlineSession)return true;
    this.online.connecting=true;
    this.online.status='CONTACTING RELAY...';
    try{
      const session=new OnlineSession(getSocketUrl(),msg=>this.handleOnlineMessage(msg),()=>this.handleOnlineDisconnect());
      await session.connect();
      this.onlineSession=session;
      this.online.connecting=false;
      return true;
    }catch(err){
      this.online.connecting=false;
      this.menuNotice=err.message||'Online relay unreachable.';
      return false;
    }
  }
  async hostOnlineRoom(){
    if(this.online.connecting)return;
    this.gameMode='online';
    if(!await this.ensureOnlineSession())return;
    this.online.active=true;
    this.online.status='ALLOCATING ROOM...';
    this.onlineSession.send('CREATE_ROOM');
  }
  async joinOnlineRoom(){
    if(this.online.connecting)return;
    const code=(window.prompt('Enter invite code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if(!code){
      this.menuNotice='Join cancelled.';
      return;
    }
    this.gameMode='online';
    if(!await this.ensureOnlineSession())return;
    this.online.active=true;
    this.online.status='JOINING ROOM '+code+'...';
    this.onlineSession.send('JOIN_ROOM',{code});
  }
  updateLobby(){
    const tap=this.input.consumeTap();
    if(tap&&this.handleLobbyTap(tap))return;
    if(this.input.wasPressed('Escape')){
      this.audio.menuMove();
      this.goMenu('Room closed.');
      return;
    }
    if(this.input.wasPressed('Enter')||this.input.wasPressed('Space')||this.input.wasPressed('NumpadEnter')){
      this.copyRoomCode();
    }
  }

  /* ══════════════════════════════════════════════
     MENU
  ══════════════════════════════════════════════ */
  updateMenu(){
    // Attract mode — exit on any input, advance animation
    if(this.attractMode){
      const exit=this.input.wasPressed('Enter')||this.input.wasPressed('Space')||
                 this.input.wasPressed('Escape')||this.input.wasPressed('ArrowDown')||
                 this.input.wasPressed('ArrowUp')||this.input.wasPressed('KeyW')||
                 this.input.wasPressed('KeyS')||!!this.input.consumeTap();
      if(exit){this.attractMode=false;this.attractIdle=0;}
      this.attractTime+=this.dt;
      this.attractTankP+=this.dt*0.00016; // full oval loop in ~6s
      const DUR=[5000,9000,7000];
      if(this.attractTime>DUR[this.attractPhase]){
        this.attractPhase=(this.attractPhase+1)%3;
        this.attractTime=0;
      }
      return;
    }
    // Idle tracking — only count idle time when on main menu
    if(this.menuMode==='main') this.attractIdle+=this.dt;
    else this.attractIdle=0;
    if(this.attractIdle>10000){
      this.attractMode=true;this.attractPhase=0;this.attractTime=0;this.attractTankP=0;
      this.attractIdle=0;return;
    }
    const {items:allItems,selectedKey:selKey}=this.getActiveMenuContext();
    const tap=this.input.consumeTap();
    if(tap&&this.handleMenuTap(tap))return;
    if(this.input.wasPressed('ArrowDown')||this.input.wasPressed('KeyS')){
      do{this[selKey]=(this[selKey]+1)%allItems.length;}while(allItems[this[selKey]].dim);
      this.attractIdle=0;this.audio.menuMove();
    }
    if(this.input.wasPressed('ArrowUp')||this.input.wasPressed('KeyW')){
      do{this[selKey]=(this[selKey]-1+allItems.length)%allItems.length;}while(allItems[this[selKey]].dim);
      this.attractIdle=0;this.audio.menuMove();
    }
    if(this.input.wasPressed('Enter')||this.input.wasPressed('Space')||this.input.wasPressed('NumpadEnter')){
      const item=allItems[this[selKey]];
      if(item.fn){this.attractIdle=0;this.audio.menuSelect();item.fn();}
    }
    if(this.input.wasPressed('Escape')){
      if(this.menuMode==='share'){
        this.menuMode='settings';
        this.shareSel=0;
        this.shareNotice='';
        this.attractIdle=0;this.audio.menuMove();
        return;
      }
      if(this.menuMode==='local'||this.menuMode==='online'||this.menuMode==='settings'||this.menuMode==='powerups'){
        this.menuMode='main';this.localModeSel=0;
        this.onlineModeSel=0;
        this.settingsSel=0;
        this.attractIdle=0;this.audio.menuMove();
      }
    }
  }
  toggleMute(){
    this.audio.setMuted(!this.audio.muted);
    if(this.menuMode==='share')this.shareNotice=this.audio.muted?'AUDIO MUTED':'AUDIO ENABLED';
  }
  copyShareLink(){
    const url=this.getShareUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url)
        .then(()=>{this.shareNotice='LINK COPIED';})
        .catch(()=>{this.shareNotice='COPY FAILED';});
    }else{
      this.shareNotice='COPY NOT SUPPORTED';
    }
  }
  exitGame(){
    try{window.close();}catch(e){}
    this.goSplash();
  }
  goSelect(){
    this.state=STATE.SELECT;
    this.p1Sel=0;this.p2Sel=1;this.p1Ready=false;this.p2Ready=this.singlePlayer;
    this.startGameTimer=-1;
    this.audio.setThemeMode('title');
    if(this.isOnlineMode()){
      this.input.setTouchPlayerNum(this.online.playerNum);
      const localSel=this.online.playerNum===1?this.p1Sel:this.p2Sel;
      this.onlineSession?.send('TANK_READY',{tankType:TANK_ORDER[localSel],ready:false});
    }else this.input.setTouchPlayerNum(1);
  }
  getOnlineLocalPlayer(){
    return this.isOnlineMode()?this.online.playerNum:1;
  }
  getSelectActivePlayer(){
    if(this.isOnlineMode()){
      const localPlayer=this.getOnlineLocalPlayer();
      return localPlayer===1?(!this.p1Ready?1:0):(!this.p2Ready?2:0);
    }
    return !this.p1Ready?1:!this.p2Ready?2:0;
  }
  updateOnlineSelection(index,ready){
    const localPlayer=this.getOnlineLocalPlayer();
    if(localPlayer===1){
      this.p1Sel=index;
      this.p1Ready=ready;
    }else{
      this.p2Sel=index;
      this.p2Ready=ready;
    }
    this.onlineSession?.send('TANK_READY',{tankType:TANK_ORDER[index],ready});
  }
  handleOnlineMessage(msg){
    switch(msg.type){
      case 'ROOM_CREATED':
        this.online.active=true;
        this.online.playerNum=msg.playerNum||1;
        this.online.roomCode=msg.code||'';
        this.online.remoteConnected=false;
        this.online.status='SHARE CODE '+this.online.roomCode+' WITH PLAYER 2';
        this.input.setTouchPlayerNum(this.online.playerNum);
        this.state=STATE.LOBBY;
        this.copyRoomCode(true);
        break;
      case 'PLAYER_JOINED':
        this.online.remoteConnected=true;
        this.online.status='PLAYER 2 CONNECTED';
        this.goSelect();
        break;
      case 'JOINED':
        this.online.active=true;
        this.online.playerNum=msg.playerNum||2;
        this.online.roomCode=msg.code||'';
        this.online.remoteConnected=true;
        this.online.status='JOINED ROOM '+this.online.roomCode;
        this.input.setTouchPlayerNum(this.online.playerNum);
        this.goSelect();
        break;
      case 'TANK_READY':{
        const idx=Math.max(0,TANK_ORDER.indexOf(msg.tankType));
        const remoteReady=!!msg.ready;
        if(msg.playerNum===1){
          this.p1Sel=idx;
          this.p1Ready=remoteReady;
        }else if(msg.playerNum===2){
          this.p2Sel=idx;
          this.p2Ready=remoteReady;
        }
        break;
      }
      case 'REMOTE_INPUT':
        if(this.isOnlineHost()){
          const input=msg.input||this.blankControlState();
          const heldFire=!!input.held?.fire;
          if(!input.pressed)input.pressed={};
          input.pressed.fire=!!input.pressed.fire||(heldFire&&!this.online.remoteFireHeld);
          this.online.remoteFireHeld=heldFire;
          this.online.remoteInput=input;
        }
        break;
      case 'GAME_EVENT':
        this.handleOnlineGameEvent(msg.event||{});
        break;
      case 'DISCONNECTED':
        this.goMenu('Remote player disconnected.');
        break;
      case 'ERROR':
        this.goMenu(msg.message||'Online room error.');
        break;
    }
  }
  handleOnlineDisconnect(){
    if(this.online.connecting)return;
    if(this.isOnlineMode()||this.state===STATE.LOBBY)this.goMenu('Online link lost.');
  }
  handleOnlineGameEvent(event){
    if(!event||typeof event!=='object')return;
    if(event.kind==='SNAPSHOT'&&this.isOnlineGuest()){
      this.applyOnlineSnapshot(event.snapshot);
    }else if(event.kind==='START_MATCH'&&this.isOnlineGuest()){
      this.applyOnlineSnapshot(event.snapshot);
    }else if(event.kind==='PAUSE'){
      if(event.paused)this.openPauseMenu('remote');
      else this.closePauseMenu('remote');
    }else if(event.kind==='SURRENDER'){
      this.forceSurrender(event.playerNum);
    }else if(event.kind==='END_ACTION'){
      if(event.action==='select'){
        this.goSelect();
      }else if(event.action==='menu'){
        this.goMenu('Room closed.');
      }
    }
  }
  copyRoomCode(silent=false){
    if(!this.online.roomCode)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(this.online.roomCode)
        .then(()=>{if(!silent)this.online.status='CODE COPIED: '+this.online.roomCode;})
        .catch(()=>{if(!silent)this.online.status='SHARE CODE '+this.online.roomCode;});
    }
  }

  /* ══════════════════════════════════════════════
     TANK SELECT
  ══════════════════════════════════════════════ */
  updateSelect(){
    this.selectBlink+=this.dt;
    const tap=this.input.consumeTap();
    if(tap&&this.handleSelectTap(tap))return;
    if(this.isOnlineMode()){
      const localPlayer=this.getOnlineLocalPlayer();
      const selKeyPrev=localPlayer===1?this.p1Sel:this.p2Sel;
      const ready=localPlayer===1?this.p1Ready:this.p2Ready;
      if(!ready){
        const leftPressed=localPlayer===1?this.input.wasPressed('KeyA'):this.input.wasPressed('ArrowLeft');
        const rightPressed=localPlayer===1?this.input.wasPressed('KeyD'):this.input.wasPressed('ArrowRight');
        const confirmPressed=localPlayer===1?this.input.wasPressed('Space'):(this.input.wasPressed('Enter')||this.input.wasPressed('NumpadEnter'));
        if(leftPressed){
          this.updateOnlineSelection((selKeyPrev-1+TANK_ORDER.length)%TANK_ORDER.length,false);
          this.audio.menuMove();
        }
        if(rightPressed){
          this.updateOnlineSelection((selKeyPrev+1)%TANK_ORDER.length,false);
          this.audio.menuMove();
        }
        if(confirmPressed){
          this.updateOnlineSelection(localPlayer===1?this.p1Sel:this.p2Sel,true);
          this.audio.menuSelect();
        }
      }
      if(this.p1Ready&&this.p2Ready&&this.isOnlineHost()&&this.startGameTimer<0){
        this.startGameTimer=300;
      }
      if(this.startGameTimer>=0){
        this.startGameTimer-=this.dt;
        if(this.startGameTimer<=0)this.startOnlineMatch();
      }
    }else{
      if(!this.p1Ready){
        if(this.input.wasPressed('KeyA')){this.p1Sel=(this.p1Sel-1+4)%4;this.audio.menuMove();}
        if(this.input.wasPressed('KeyD')){this.p1Sel=(this.p1Sel+1)%4;this.audio.menuMove();}
        if(this.input.wasPressed('Space')){this.p1Ready=true;this.audio.menuSelect();}
      }
      if(this.singlePlayer){
        this.p2Sel=(this.p1Sel+1)%TANK_ORDER.length;
      }else if(!this.p2Ready){
        if(this.input.wasPressed('ArrowLeft')){ this.p2Sel=(this.p2Sel-1+4)%4;this.audio.menuMove();}
        if(this.input.wasPressed('ArrowRight')){this.p2Sel=(this.p2Sel+1)%4;this.audio.menuMove();}
        if(this.input.wasPressed('Enter')||this.input.wasPressed('NumpadEnter')){this.p2Ready=true;this.audio.menuSelect();}
      }
      if(this.p1Ready&&this.p2Ready&&this.startGameTimer<0){
        this.startGameTimer=300;
      }
      if(this.startGameTimer>=0){
        this.startGameTimer-=this.dt;
        if(this.startGameTimer<=0)this.startGame();
      }
    }
    if(this.singlePlayer&&!this.isOnlineMode()){
      this.p2Sel=(this.p1Sel+1)%TANK_ORDER.length;
    }
    if(this.input.wasPressed('Escape')){
      this.goMenu();
    }
  }

  /* ══════════════════════════════════════════════
     START GAME
  ══════════════════════════════════════════════ */
  startGame(){
    this.state=STATE.PLAYING;
    this.audio.setThemeMode('game');
    this.bullets=[];this.powerups=[];this.landMines=[];this.ps=new ParticleSystem();this.tracks=[];
    this.onlineEvents=[];
    this.puTimer=PU_INTERVAL;this.matchOver=false;this.winner=null;
    this.killFeed=[];this.mapIdx=0;this.roundNum=0;this.startGameTimer=-1;

    const mapData=MAPS[this.mapIdx%MAPS.length];
    this.arena.load(mapData);
    this.arena.loadTunnels(MAP_TUNNELS[this.mapIdx%MAPS.length]);

    const c1=this.getPlayerControls(1);
    const c2=this.getPlayerControls(2);

    const t1type=TANK_ORDER[this.p1Sel];
    const t2type=TANK_ORDER[this.p2Sel];

    this.tanks=[
      new Tank(t1type, W/2, ARENA_BOTTOM-TS*5-TS/2, 0,     c1, 1, this.demoMode),
      new Tank(t2type, W/2, HUD+TS*3+TS/2, Math.PI,c2, 2, this.singlePlayer||this.demoMode),
    ];
    this.tanks.forEach(t=>{t.kills=0;t.roundKills=0;});
    // Countdown
    this.countdownVal=3;this.countdownTimer=0;
    this.gameReady=false;
    this._prevRoundKills=[0,0];
    this.input.setTouchPlayerNum(this.isOnlineMode()?this.online.playerNum:1);
    if(this.isOnlineMode()){
      this.online.snapshotTimer=0;
      this.online.inputTimer=0;
      this.online.lastInputSig='';
      this.online.remoteInput=this.blankControlState();
      this.online.remoteFireHeld=false;
    }
  }
  startOnlineMatch(){
    if(!this.isOnlineHost())return;
    this.startGame();
    const snapshot=this.serializeOnlineSnapshot();
    this.onlineSession?.send('GAME_EVENT',{event:{kind:'START_MATCH',snapshot}});
    this.onlineSession?.send('GAME_EVENT',{event:{kind:'SNAPSHOT',snapshot}});
  }

  nextRound(){
    this.roundNum++;
    this.mapIdx++;
    // Use procedural map for round 4+
    const mapData=this.roundNum>=3?genMap():MAPS[(this.mapIdx)%MAPS.length];
    this.arena.load(mapData);
    this.arena.loadTunnels(this.roundNum>=3?this.genTunnels():MAP_TUNNELS[this.mapIdx%MAPS.length]);
    this.bullets=[];this.powerups=[];this.landMines=[];this.puTimer=PU_INTERVAL;this.tracks=[];
    this.tanks.forEach((t,i)=>{
      t.alive=false;t.respawnTimer=0;t.roundKills=0;
      t.shield=false;t.ghost=false;t.rapid=false;t.triple=false;t.bounceBonus=false;t.wallBreak=false;t.wallBreakTimer=0;
      t.shrapnel=false;t.shrapnelTimer=0;t.hspeed=false;t.hspeedFuel=0;
      t.radarPing=false;t.radarPulses=[];t.radarPulsesLeft=0;
      t.respawn(this.arena);
      t.angle=i===0?0:Math.PI;
    });
    this.countdownVal=3;this.countdownTimer=0;this.gameReady=false;
    this.matchOver=false;this.winner=null;
    this._prevRoundKills=[0,0];
  }

  /* ══════════════════════════════════════════════
     PLAYING UPDATE
  ══════════════════════════════════════════════ */
  updatePlay(){
    const tap=this.input.consumeTap();
    if(this.canOpenPauseMenu()&&((tap&&this.handlePauseButtonTap(tap))||this.input.wasPressed('Escape'))){
      this.audio.menuMove();
      this.openPauseMenu();
      return;
    }
    if(this.isOnlineGuest()){
      this.sendOnlineInput();
      this.ps.update();
      return;
    }
    // Countdown: 3→2→1→GO!→start
    if(!this.gameReady){
      this.countdownTimer+=this.dt;
      if(this.countdownTimer>1000){
        this.countdownTimer=0;
        if(this.countdownVal>0){
          this.countdownVal--;
          if(this.countdownVal===0)this.audio.countBeep(true);
          else this.audio.countBeep(false);
        }else{
          this.gameReady=true;
        }
      }
      if(this.isOnlineHost())this.broadcastOnlineSnapshot();
      return;
    }
    if(this.matchOver){
      this.winTimer+=this.dt;
      this.ps.update();
      if(this.winTimer>2500){
        if(this.winner)this.winner.kills++;
        if(this.winner&&this.winner.kills>=KILLS_WIN){
          this.goEnd();
        }else{
          this.nextRound();
        }
      }
      if(this.isOnlineHost())this.broadcastOnlineSnapshot();
      return;
    }

    // Respawn
    this.tanks.forEach(t=>{
      if(!t.alive&&t.respawnTimer<=0)t.respawn(this.arena);
    });

    // Tank updates
    this.tanks.forEach((t,i)=>{
      let controlState=null;
      if(t.isCPU)controlState=this.flagsToControlState(this.getBotInput(t,this.tanks[(i+1)%2]));
      else if(this.isOnlineHost()&&t.playerNum===2)controlState=this.online.remoteInput||this.blankControlState();
      t.update(this.input,this.dt,this.arena,this.bullets,this.audio,this.now,controlState,this.landMines);
    });

    // Track stamps
    this.tracks.forEach(tr=>{tr.life-=0.005;});
    this.tracks=this.tracks.filter(tr=>tr.life>0);
    this.tanks.forEach(t=>{
      if(!t.alive)return;
      const dx=t.x-t.lastTrackX,dy=t.y-t.lastTrackY;
      if(dx*dx+dy*dy>36){
        this.tracks.push({x:t.x,y:t.y,angle:t.angle,col:t.dark,life:1});
        t.lastTrackX=t.x;t.lastTrackY=t.y;
      }
    });

    // Tunnel teleportation
    this.tanks.forEach(t=>{
      if(!t.alive||t.tunnelCooldown>0)return;
      const cell=this.arena.worldToCell(t.x,t.y);
      const tunnel=this.arena.getTunnelAt(cell.col,cell.row);
      if(tunnel){
        const dest=this.arena.cellCenter(tunnel.partner.col,tunnel.partner.row);
        this.ps.emit(t.x,t.y,tunnel.col,14,5,3,28);
        const ex1=t.x,ey1=t.y;
        t.x=dest.x;t.y=dest.y;
        this.ps.emit(t.x,t.y,tunnel.col,14,5,3,28);
        t.tunnelCooldown=1600;
        t.teleportTimer=500;
        this.onlineEvents.push({type:'teleport',x1:ex1,y1:ey1,x2:t.x,y2:t.y,col:tunnel.col});
      }
    });

    // Shake from tanks
    this.tanks.forEach(t=>{if(t.shakeAmt>0){this.addShake(t.shakeAmt);t.shakeAmt=0;}});

    // Bullets
    this.bullets=this.bullets.filter(b=>b.active);
    const _newBullets=[];
    this.bullets.forEach(b=>b.update(this.arena,this.tanks,this.ps,this.audio,this.ricochetOn,this.friendlyFire,this.onlineEvents,_newBullets));
    this.bullets.push(..._newBullets);

    // Kill detection — track kills via tank.kills
    // Check for new kills (compare to stored)
    if(this._prevRoundKills){
      if(this.tanks[0].roundKills>this._prevRoundKills[0]){
        this.killFeed.unshift({text:`P1 ELIMINATED P2`,col:this.tanks[0].col,timer:3000});
        if(this.killFeed.length>3)this.killFeed.pop();
      }
      if(this.tanks[1].roundKills>this._prevRoundKills[1]){
        this.killFeed.unshift({text:`P2 ELIMINATED P1`,col:this.tanks[1].col,timer:3000});
        if(this.killFeed.length>3)this.killFeed.pop();
      }
    }
    this._prevRoundKills=[this.tanks[0].roundKills,this.tanks[1].roundKills];
    this.killFeed=this.killFeed.filter(k=>{k.timer-=this.dt;return k.timer>0;});

    // Power-ups
    this.puTimer-=this.dt;
    if(this.puTimer<=0){this.spawnPU();this.puTimer=PU_INTERVAL;}
    this.powerups=this.powerups.filter(p=>p.active);
    this.powerups.forEach(p=>{
      p.update();
      this.tanks.forEach(t=>{
        if(t.alive&&p.checkCollect(t)){p.active=false;t.applyPU(p.type,this.audio);this.onlineEvents.push({type:'powerup'});}
      });
    });

    // Particles
    this.ps.update();

    // Land mine updates + collision
    this.landMines=this.landMines.filter(m=>m.active);
    this.landMines.forEach(m=>{
      m.update(this.dt);
      const victim=m.checkTrigger(this.tanks);
      if(victim){
        m.active=false;
        // Explosion
        this.ps.emit(m.x,m.y,'#ffffff',24,16,5,7);
        this.ps.emit(m.x,m.y,'#ffff99',20,13,6,12);
        this.ps.emit(m.x,m.y,'#cc4400',28,10,8,30);
        this.ps.emit(m.x,m.y,'#ff5500',24,8,9,40);
        this.audio.explosion?.();
        this.addShake(3);
        if(victim.alive&&!victim.shield){
          const killer=this.tanks.find(t=>t.playerNum===m.ownerPlayerNum);
          if(killer&&killer!==victim){killer.kills++;killer.roundKills++;}
          victim.die(this.ps,this.audio);
          this.onlineEvents.push({type:'death',x:m.x,y:m.y,col:victim.col});
          // Kill feed with mine attribution
          const vName=`P${victim.playerNum}`;
          const kName=`P${m.ownerPlayerNum}`;
          const msg=m.ownerPlayerNum===victim.playerNum
            ?`${vName} STEPPED ON OWN MINE`
            :`${kName} MINED ${vName}`;
          this.killFeed.unshift({text:msg,col:PU_DEF.MINE.col,timer:4000,mine:true});
          if(this.killFeed.length>3)this.killFeed.pop();
        }else if(victim.shield){
          victim.shield=false;
          this.ps.emit(m.x,m.y,PU_DEF.SHIELD.col,14,8,4,18);
        }
      }
    });

    // Round win condition — first to ROUND_KILLS_TO_WIN takes the round
    const winner=this.tanks.find(t=>t.roundKills>=ROUND_KILLS_TO_WIN);
    if(winner&&!this.matchOver){
      this.matchOver=true;this.winner=winner;this.winTimer=0;
      this.audio.victoryFanfare();
      this.addShake(2);
      for(let i=0;i<8;i++){
        setTimeout(()=>{
